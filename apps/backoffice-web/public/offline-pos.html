<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CpIPOS Offline POS</title>
  <style>
    :root {
      --brand:#0b63f6;
      --orange:#ff6b14;
      --orange-dark:#ea580c;
      --danger:#dc2626;
      --ink:#111827;
      --muted:#64748b;
      --line:#d9e2ef;
      --soft:#f5f8fc;
      --bg:#edf3fa;
      --green:#059669;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body {
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: Tahoma, Arial, sans-serif;
      font-size:14px;
      overflow:hidden;
    }
    button, input, select { font:inherit; }
    button { user-select:none; }
    .app {
      display:grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap:12px;
      height:100vh;
      padding:12px;
    }
    .left, .right {
      min-height:0;
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(15,23,42,.06);
      overflow:hidden;
    }
    .left { display:grid; grid-template-rows:auto auto auto minmax(0,1fr); }
    .right { display:grid; grid-template-rows:auto minmax(0,1fr) auto; }
    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:14px 16px 10px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .title { display:flex; align-items:center; gap:10px; }
    .mark {
      width:38px;
      height:38px;
      border-radius:13px;
      background:linear-gradient(135deg,#0b63f6,#38bdf8);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      letter-spacing:-.04em;
    }
    h1 { margin:0; font-size:22px; line-height:1.2; }
    h2 { margin:0; font-size:16px; }
    .sub { color:var(--muted); font-size:12px; margin-top:2px; }
    .offline-pill {
      border:1px solid #fed7aa;
      background:#fff7ed;
      color:#c2410c;
      border-radius:999px;
      padding:7px 12px;
      font-size:12px;
      font-weight:900;
    }
    .mode-tabs {
      display:grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap:8px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:#fbfdff;
    }
    .tab {
      min-height:44px;
      border:1px solid var(--line);
      border-radius:13px;
      background:#fff;
      color:#0f172a;
      font-weight:900;
      cursor:default;
    }
    .tab.active { border-color:#fb923c; background:#fff7ed; color:#ea580c; }
    .tab.disabled { color:#94a3b8; background:#f8fafc; }
    .tools {
      display:grid;
      grid-template-columns:minmax(180px,1fr) 170px 150px 130px;
      gap:8px;
      padding:12px 16px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    input, select {
      min-height:42px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      padding:0 12px;
      background:#fff;
      outline:none;
    }
    input:focus, select:focus { border-color:#60a5fa; box-shadow:0 0 0 3px rgba(37,99,235,.1); }
    .btn {
      min-height:42px;
      border:0;
      border-radius:12px;
      padding:0 14px;
      font-weight:900;
      cursor:pointer;
      background:var(--brand);
      color:#fff;
    }
    .btn.dark { background:#334155; }
    .btn.orange { background:var(--orange); }
    .btn.danger { background:var(--danger); }
    .btn.light { background:#f8fafc; color:#0f172a; border:1px solid #cbd5e1; }
    .main-scroll { min-height:0; overflow:auto; padding:14px 16px 18px; }
    .status { margin-bottom:12px; border-radius:14px; padding:12px 14px; line-height:1.55; }
    .status.ok { color:#065f46; background:#ecfdf5; border:1px solid #bbf7d0; }
    .status.warn { color:#92400e; background:#fffbeb; border:1px solid #fde68a; }
    .status.err { color:#991b1b; background:#fef2f2; border:1px solid #fecaca; }
    .category-strip {
      display:flex;
      gap:8px;
      overflow:auto;
      padding-bottom:10px;
      margin-bottom:10px;
    }
    .cat-pill {
      min-height:38px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:#334155;
      padding:0 14px;
      font-weight:800;
      white-space:nowrap;
    }
    .cat-pill.active { background:#fff7ed; border-color:#fb923c; color:#ea580c; }
    .product-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(162px,1fr));
      gap:10px;
    }
    .product {
      min-height:126px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:15px;
      padding:12px;
      text-align:left;
      color:var(--ink);
      cursor:pointer;
      box-shadow:0 3px 8px rgba(15,23,42,.035);
      transition:transform .08s ease, border-color .08s ease, box-shadow .08s ease;
    }
    .product:hover { transform:translateY(-1px); border-color:#fb923c; box-shadow:0 8px 18px rgba(251,106,16,.12); }
    .product-name { display:block; font-size:15px; line-height:1.35; min-height:42px; font-weight:900; }
    .product-price { margin-top:8px; font-size:15px; color:var(--green); font-weight:900; }
    .product-meta { margin-top:5px; font-size:11px; line-height:1.35; color:#64748b; font-weight:700; }
    .cart-head {
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .cart-list { min-height:0; overflow:auto; padding:12px 14px; background:#fff; }
    .empty {
      border:1px dashed #cbd5e1;
      border-radius:14px;
      background:#f8fafc;
      color:#64748b;
      padding:18px;
      text-align:center;
      line-height:1.6;
    }
    .cart-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      padding:12px 0;
      border-bottom:1px solid #edf2f7;
    }
    .cart-row strong { font-size:14px; }
    .qtyline { display:flex; align-items:center; gap:6px; margin-top:7px; }
    .qtybtn {
      width:32px;
      height:30px;
      border-radius:10px;
      border:1px solid #cbd5e1;
      background:#fff;
      color:#0f172a;
      font-weight:900;
      cursor:pointer;
    }
    .cart-total { font-weight:900; color:#0f172a; white-space:nowrap; }
    .checkout {
      border-top:1px solid var(--line);
      background:#f8fafc;
      padding:14px;
    }
    .summary-line { display:flex; justify-content:space-between; align-items:center; margin:7px 0; gap:12px; }
    .grand { color:#ea580c; font-size:24px; font-weight:900; }
    .cash-label { display:block; margin-top:10px; color:#475569; font-size:12px; font-weight:800; }
    .cash-input { width:100%; margin-top:6px; font-size:17px; font-weight:900; text-align:right; }
    .save { width:100%; margin-top:12px; background:var(--orange); min-height:48px; font-size:15px; }
    .clear { width:100%; margin-top:8px; min-height:42px; }
    .result { margin-top:10px; font-size:12px; line-height:1.55; }
    .result.ok { color:#065f46; }
    .result.err { color:#991b1b; }
    @media (max-width:1100px) {
      .app { grid-template-columns:1fr; overflow:auto; height:auto; min-height:100vh; }
      body { overflow:auto; }
      .right { min-height:560px; }
      .tools { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="left">
      <header class="topbar">
        <div class="title">
          <div class="mark">CP</div>
          <div>
            <h1>CpIPOS หน้าขาย Offline</h1>
            <div class="sub">ใช้รูปแบบหน้าขายหลัก + ข้อมูลสินค้า snapshot ล่าสุดในเครื่อง</div>
          </div>
        </div>
        <div class="offline-pill">OFFLINE MODE</div>
      </header>

      <nav class="mode-tabs" aria-label="Offline sale modes">
        <button class="tab active" type="button">ขายหน้าร้าน</button>
        <button class="tab disabled" type="button">โต๊ะอาหาร</button>
        <button class="tab disabled" type="button">สมาชิก</button>
        <button class="tab disabled" type="button">ส่วนลด</button>
      </nav>

      <div class="tools">
        <input id="search" type="search" placeholder="ค้นหาสินค้า / SKU" />
        <select id="categorySelect"><option value="">ทุกหมวดหมู่</option></select>
        <button class="btn light" id="reload" type="button">โหลดข้อมูลในเครื่อง</button>
        <button class="btn dark" id="goOnline" type="button">กลับออนไลน์</button>
      </div>

      <div class="main-scroll">
        <div id="status" class="status warn">กำลังโหลดข้อมูล Offline POS ในเครื่อง...</div>
        <div id="categoryStrip" class="category-strip"></div>
        <div id="products" class="product-grid"></div>
      </div>
    </section>

    <aside class="right">
      <header class="cart-head">
        <h2>รายการขาย Offline</h2>
        <div class="sub" id="snapshotInfo">ยังไม่ได้เลือกข้อมูลสินค้า</div>
      </header>
      <div id="cartList" class="cart-list"></div>
      <footer class="checkout">
        <div class="summary-line"><span>จำนวนรายการ</span><strong id="itemCount">0</strong></div>
        <div class="summary-line"><span>ยอดรวม</span><span class="grand" id="total">฿0.00</span></div>
        <label class="cash-label" for="cash">รับเงินสด</label>
        <input id="cash" class="cash-input" type="number" min="0" step="1" placeholder="0.00" />
        <div class="summary-line"><span>เงินทอน</span><strong id="change">฿0.00</strong></div>
        <button class="btn save" id="saveSale" type="button">บันทึกบิลเงินสด Offline</button>
        <button class="btn danger clear" id="clearCart" type="button">ล้างตะกร้า</button>
        <div id="saleResult" class="result"></div>
      </footer>
    </aside>
  </main>

  <script>
    const DB_NAME = 'cpipos-offline-sale';
    const DB_VERSION = 1;
    const STORE_CATALOG = 'catalog_snapshots';
    const STORE_SALES = 'offline_sales';
    const STORE_META = 'meta';
    const COUNTER_PREFIX = 'cpipos_offline_receipt_counter_v1';
    let database = null;
    let snapshot = null;
    let products = [];
    let selectedCategory = '';
    let cart = [];

    const el = (id) => document.getElementById(id);
    const money = (value) => '฿' + Number(value || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]));

    function setStatus(type, message) {
      const box = el('status');
      box.className = 'status ' + type;
      box.textContent = message;
    }

    function requestToPromise(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('indexeddb_request_failed'));
      });
    }

    function createIndexIfMissing(store, name, keyPath, options) {
      if (!store.indexNames.contains(name)) store.createIndex(name, keyPath, options || {});
    }

    function openDb() {
      if (database) return Promise.resolve(database);
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(STORE_META)) {
            const meta = db.createObjectStore(STORE_META, { keyPath: 'key' });
            createIndexIfMissing(meta, 'updated_at', 'updated_at');
          }
          if (!db.objectStoreNames.contains(STORE_CATALOG)) {
            const catalog = db.createObjectStore(STORE_CATALOG, { keyPath: 'id' });
            createIndexIfMissing(catalog, 'tenant_branch', ['tenant_id', 'branch_id']);
            createIndexIfMissing(catalog, 'saved_at', 'saved_at');
          }
          if (!db.objectStoreNames.contains(STORE_SALES)) {
            const sales = db.createObjectStore(STORE_SALES, { keyPath: 'id' });
            createIndexIfMissing(sales, 'status', 'status');
            createIndexIfMissing(sales, 'created_at', 'created_at');
            createIndexIfMissing(sales, 'order_no', 'order_no', { unique: true });
            createIndexIfMissing(sales, 'device_code', 'device_code');
            createIndexIfMissing(sales, 'tenant_branch_status', ['tenant_id', 'branch_id', 'status']);
          }
        };
        request.onsuccess = () => { database = request.result; resolve(database); };
        request.onerror = () => reject(request.error || new Error('indexeddb_open_failed'));
      });
    }

    async function getAllRecords(storeName) {
      const db = await openDb();
      return requestToPromise(db.transaction(storeName, 'readonly').objectStore(storeName).getAll());
    }

    async function putRecord(storeName, record) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error || new Error('indexeddb_write_failed'));
      });
    }

    function textFrom(item, keys, fallback) {
      for (const key of keys) {
        if (typeof item[key] === 'string' && item[key].trim()) return item[key].trim();
      }
      return fallback || '-';
    }

    function numberFrom(item, keys, fallback) {
      for (const key of keys) {
        const value = Number(item[key]);
        if (Number.isFinite(value) && value >= 0) return value;
      }
      return fallback || 0;
    }

    function normalizeProduct(item, index) {
      return {
        id: textFrom(item, ['id', 'product_id', 'sku', 'code'], 'offline-product-' + (index + 1)),
        sku: textFrom(item, ['sku', 'code', 'barcode'], ''),
        name: textFrom(item, ['name', 'product_name', 'name_th', 'title', 'display_name'], 'สินค้า ' + (index + 1)),
        category: textFrom(item, ['category', 'category_name', 'menu_category', 'group_name'], 'ทั่วไป'),
        price: numberFrom(item, ['price', 'sale_price', 'selling_price', 'unit_price', 'retail_price', 'price_amount'], 0)
      };
    }

    function safeCode(value, fallback) {
      return String(value || fallback || 'DEVICE').trim().replace(/[^a-z0-9_-]+/giu, '-').replace(/^-+|-+$/g, '').toUpperCase() || 'DEVICE';
    }

    function businessDate() {
      return new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Bangkok', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
    }

    function createOrderNo() {
      const date = businessDate();
      const compactDate = date.replace(/-/g, '');
      const deviceCode = safeCode(snapshot?.device_code || localStorage.getItem('cpi_windows_runtime_store_code_v1'), 'POS-DEVICE');
      const branchCode = snapshot?.branch_code ? safeCode(snapshot.branch_code, '') + '-' : '';
      const counterKey = `${COUNTER_PREFIX}:${branchCode}${deviceCode}:${compactDate}`;
      const next = Number(localStorage.getItem(counterKey) || '0') + 1;
      localStorage.setItem(counterKey, String(next));
      return { order_no: `OFF-${branchCode}${deviceCode}-${compactDate}-${String(next).padStart(6, '0')}`, local_sequence: next, local_business_date: date };
    }

    async function loadSnapshot() {
      try {
        if (!('indexedDB' in window)) throw new Error('เครื่องนี้ไม่รองรับ IndexedDB');
        const snapshots = await getAllRecords(STORE_CATALOG);
        snapshot = snapshots.sort((a, b) => String(b.saved_at || '').localeCompare(String(a.saved_at || '')))[0] || null;
        if (!snapshot) {
          products = [];
          selectedCategory = '';
          setStatus('err', 'ยังไม่มีข้อมูลสินค้าในเครื่อง กรุณาต่อเน็ต เข้าเมนูหน้าขาย และรอให้สินค้าโหลดครบก่อน');
          renderAll();
          return;
        }
        products = (snapshot.products || []).map(normalizeProduct);
        selectedCategory = '';
        el('snapshotInfo').textContent = `Snapshot: ${new Date(snapshot.saved_at).toLocaleString('th-TH')} / สินค้า ${products.length} รายการ`;
        setStatus('ok', `โหลดข้อมูล Offline สำเร็จ: ${products.length} รายการ`);
        renderAll();
      } catch (error) {
        setStatus('err', 'โหลด Offline POS ไม่สำเร็จ: ' + (error?.message || error));
      }
    }

    function categories() {
      return [...new Set(products.map((product) => product.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'th'));
    }

    function filteredProducts() {
      const query = el('search').value.trim().toLowerCase();
      const category = selectedCategory || el('categorySelect').value;
      return products.filter((product) => {
        const categoryOk = !category || product.category === category;
        const queryOk = !query || product.name.toLowerCase().includes(query) || product.sku.toLowerCase().includes(query);
        return categoryOk && queryOk;
      });
    }

    function renderCategories() {
      const items = categories();
      el('categorySelect').innerHTML = '<option value="">ทุกหมวดหมู่</option>' + items.map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join('');
      el('categorySelect').value = selectedCategory;
      el('categoryStrip').innerHTML = '<button class="cat-pill ' + (!selectedCategory ? 'active' : '') + '" data-category="">ทั้งหมด</button>' + items.map((category) => `<button class="cat-pill ${selectedCategory === category ? 'active' : ''}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join('');
      document.querySelectorAll('.cat-pill').forEach((button) => {
        button.addEventListener('click', () => {
          selectedCategory = button.dataset.category || '';
          renderAll();
        });
      });
    }

    function renderProducts() {
      const items = filteredProducts();
      if (!items.length) {
        el('products').innerHTML = '<div class="empty" style="grid-column:1/-1">ไม่พบสินค้าในเงื่อนไขนี้</div>';
        return;
      }
      el('products').innerHTML = items.map((product) => `
        <button class="product" type="button" data-id="${escapeHtml(product.id)}">
          <span class="product-name">${escapeHtml(product.name)}</span>
          <div class="product-price">${money(product.price)}</div>
          <div class="product-meta">${escapeHtml(product.category || 'ทั่วไป')}${product.sku ? ' / ' + escapeHtml(product.sku) : ''}</div>
        </button>
      `).join('');
      document.querySelectorAll('.product').forEach((button) => button.addEventListener('click', () => addToCart(button.dataset.id)));
    }

    function addToCart(productId) {
      const product = products.find((item) => item.id === productId);
      if (!product) return;
      const existing = cart.find((item) => item.id === productId);
      if (existing) existing.quantity += 1;
      else cart.push({ ...product, quantity: 1 });
      renderCart();
    }

    window.changeQty = function changeQty(productId, delta) {
      const item = cart.find((entry) => entry.id === productId);
      if (!item) return;
      item.quantity += delta;
      cart = cart.filter((entry) => entry.quantity > 0);
      renderCart();
    };

    function currentTotals() {
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const cash = Number(el('cash').value || 0);
      return { subtotal, discount_amount:0, tax_total:0, total_amount:subtotal, cash_received:cash, change_amount:Math.max(0, cash - subtotal) };
    }

    function renderCart() {
      if (!cart.length) {
        el('cartList').innerHTML = '<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>';
      } else {
        el('cartList').innerHTML = cart.map((item) => `
          <div class="cart-row">
            <div>
              <strong>${escapeHtml(item.name)}</strong>
              <div class="sub">${money(item.price)} x ${item.quantity}</div>
              <div class="qtyline">
                <button class="qtybtn" type="button" onclick="changeQty('${escapeHtml(item.id)}', -1)">-</button>
                <strong>${item.quantity}</strong>
                <button class="qtybtn" type="button" onclick="changeQty('${escapeHtml(item.id)}', 1)">+</button>
              </div>
            </div>
            <div class="cart-total">${money(item.price * item.quantity)}</div>
          </div>
        `).join('');
      }
      const totals = currentTotals();
      el('itemCount').textContent = String(cart.reduce((sum, item) => sum + item.quantity, 0));
      el('total').textContent = money(totals.total_amount);
      el('change').textContent = money(totals.change_amount);
    }

    async function saveSale() {
      const totals = currentTotals();
      if (!snapshot) throw new Error('ยังไม่มี snapshot สินค้า');
      if (!cart.length) throw new Error('ยังไม่มีสินค้าในตะกร้า');
      if (totals.cash_received < totals.total_amount) throw new Error('รับเงินสดน้อยกว่ายอดรวม');
      const receipt = createOrderNo();
      const now = new Date().toISOString();
      const sale = {
        id: 'offline_sale_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)),
        tenant_id: snapshot.tenant_id || 'offline-tenant',
        branch_id: snapshot.branch_id || 'offline-branch',
        shift_id: null,
        user_id: 'offline-cashier',
        device_id: null,
        device_code: snapshot.device_code || 'POS-DEVICE',
        branch_code: snapshot.branch_code || null,
        seller_name: 'Offline cashier',
        order_no: receipt.order_no,
        order_type: 'takeaway',
        table_id: null,
        items: cart.map((item) => ({ product_id:item.id, sku:item.sku || null, name:item.name, category:item.category || null, quantity:item.quantity, unit_price:item.price, line_total:item.price * item.quantity, notes:null, tax_lines:[] })),
        totals,
        receipt_html: null,
        metadata: { source:'offline-pos-html', snapshot_id:snapshot.id, requires_sync:true },
        local_sequence: receipt.local_sequence,
        local_business_date: receipt.local_business_date,
        payment_method: 'cash',
        status: 'queued',
        created_at: now,
        updated_at: now,
        sync_attempts: 0,
        last_sync_attempt_at: null,
        last_sync_error: null,
        server_order_id: null,
        synced_at: null,
        void_reason: null
      };
      await putRecord(STORE_SALES, sale);
      cart = [];
      el('cash').value = '';
      renderCart();
      el('saleResult').className = 'result ok';
      el('saleResult').textContent = `บันทึกบิล offline สำเร็จ: ${sale.order_no} รอ sync เมื่อเน็ตกลับมา`;
    }

    function renderAll() {
      renderCategories();
      renderProducts();
      renderCart();
    }

    el('reload').addEventListener('click', loadSnapshot);
    el('goOnline').addEventListener('click', () => { window.location.href = '/login/store'; });
    el('search').addEventListener('input', renderProducts);
    el('categorySelect').addEventListener('change', (event) => { selectedCategory = event.target.value; renderAll(); });
    el('cash').addEventListener('input', renderCart);
    el('clearCart').addEventListener('click', () => { cart = []; el('cash').value = ''; renderCart(); el('saleResult').textContent = ''; });
    el('saveSale').addEventListener('click', async () => {
      try { await saveSale(); }
      catch (error) { el('saleResult').className = 'result err'; el('saleResult').textContent = error?.message || String(error); }
    });

    loadSnapshot();
  </script>
</body>
</html>
