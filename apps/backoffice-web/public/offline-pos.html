<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CpIPOS Offline POS</title>
  <style>
    :root { --blue:#0b63f6; --orange:#fb6a10; --ink:#0f172a; --muted:#64748b; --line:#dbe4f0; --bg:#eef4fb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family: Tahoma, Arial, sans-serif; }
    .app { display:grid; grid-template-columns: 1fr 360px; gap:14px; min-height:100vh; padding:14px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 14px 40px rgba(15,23,42,.08); overflow:hidden; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:22px; } h2 { margin:0; font-size:16px; }
    .badge { border-radius:999px; padding:7px 10px; font-weight:700; font-size:12px; background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
    .sub,.small { color:var(--muted); font-size:12px; line-height:1.5; }
    .toolbar { display:flex; gap:8px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    input, select { min-height:40px; border:1px solid #cbd5e1; border-radius:11px; padding:0 12px; font:inherit; background:white; }
    input[type="search"] { flex:1; min-width:220px; }
    button { min-height:40px; border:0; border-radius:11px; padding:0 14px; font-weight:800; cursor:pointer; background:var(--blue); color:white; }
    button.secondary { background:#334155; } button.orange { background:var(--orange); } button.danger { background:#dc2626; } button.ghost { background:#f8fafc; color:#0f172a; border:1px solid #cbd5e1; }
    .content { padding:16px 18px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap:10px; }
    .product { min-height:108px; text-align:left; border:1px solid var(--line); background:#fff; border-radius:14px; padding:12px; color:var(--ink); cursor:pointer; }
    .product strong { display:block; font-size:15px; line-height:1.35; min-height:40px; }
    .price { color:#059669; font-weight:900; margin-top:8px; } .meta { color:var(--muted); font-size:11px; margin-top:5px; }
    .cart { display:flex; flex-direction:column; height:calc(100vh - 28px); }
    .cart-list { flex:1; overflow:auto; padding:12px; }
    .cart-row { display:grid; grid-template-columns: 1fr auto; gap:8px; padding:10px 0; border-bottom:1px solid #edf2f7; }
    .totals { border-top:1px solid var(--line); padding:14px; background:#f8fafc; }
    .line { display:flex; justify-content:space-between; gap:12px; margin:6px 0; }
    .grand { font-size:22px; font-weight:900; color:#ea580c; }
    .empty,.error,.ok { border-radius:14px; padding:14px; line-height:1.6; }
    .empty { background:#f8fafc; border:1px dashed #cbd5e1; color:#475569; } .error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; } .ok { background:#ecfdf5; border:1px solid #bbf7d0; color:#065f46; }
    @media (max-width: 960px) { .app { grid-template-columns: 1fr; } .cart { height:auto; min-height:420px; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <div class="header"><div><h1>CpIPOS Offline POS</h1><div class="sub">ใช้ข้อมูลสินค้า snapshot ล่าสุดในเครื่อง และบันทึกบิลเงินสดเข้า offline queue</div></div><div class="badge">OFFLINE</div></div>
      <div class="toolbar"><input id="search" type="search" placeholder="ค้นหาสินค้า" /><select id="category"><option value="">ทุกหมวดหมู่</option></select><button class="ghost" id="reload">โหลดข้อมูลในเครื่อง</button><button class="secondary" id="goOnline">กลับออนไลน์</button></div>
      <div class="content"><div id="status" class="empty">กำลังโหลดข้อมูล offline ในเครื่อง...</div><div id="products" class="grid" style="margin-top:12px"></div></div>
    </section>
    <aside class="panel cart"><div class="header"><div><h2>ตะกร้า Offline</h2><div class="sub" id="snapshotInfo">ยังไม่ได้เลือก snapshot</div></div></div><div id="cartList" class="cart-list"></div><div class="totals"><div class="line"><span>จำนวนรายการ</span><strong id="itemCount">0</strong></div><div class="line grand"><span>ยอดรวม</span><span id="total">฿0.00</span></div><label class="small" for="cash">รับเงินสด</label><input id="cash" type="number" min="0" step="1" placeholder="0.00" style="width:100%; margin-top:6px" /><div class="line"><span>เงินทอน</span><strong id="change">฿0.00</strong></div><button class="orange" id="saveSale" style="width:100%; margin-top:12px">บันทึกบิลเงินสด Offline</button><button class="danger" id="clearCart" style="width:100%; margin-top:8px">ล้างตะกร้า</button><div id="saleResult" style="margin-top:10px"></div></div></aside>
  </main>
  <script>
    const DB_NAME='cpipos-offline-sale', DB_VERSION=1, STORE_CATALOG='catalog_snapshots', STORE_SALES='offline_sales', STORE_META='meta', COUNTER_PREFIX='cpipos_offline_receipt_counter_v1';
    let database=null, snapshot=null, products=[], cart=[];
    const el=(id)=>document.getElementById(id); const money=(v)=>'฿'+Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
    function setStatus(kind,msg){const box=el('status'); box.className=kind||'empty'; box.textContent=msg;}
    function req(request){return new Promise((resolve,reject)=>{request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error||new Error('indexeddb_request_failed'));});}
    function idx(store,name,key,options){ if(!store.indexNames.contains(name)) store.createIndex(name,key,options||{}); }
    function openDb(){ if(database) return Promise.resolve(database); return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION); r.onupgradeneeded=()=>{const db=r.result; if(!db.objectStoreNames.contains(STORE_META)){idx(db.createObjectStore(STORE_META,{keyPath:'key'}),'updated_at','updated_at');} if(!db.objectStoreNames.contains(STORE_CATALOG)){const s=db.createObjectStore(STORE_CATALOG,{keyPath:'id'}); idx(s,'tenant_branch',['tenant_id','branch_id']); idx(s,'saved_at','saved_at');} if(!db.objectStoreNames.contains(STORE_SALES)){const s=db.createObjectStore(STORE_SALES,{keyPath:'id'}); idx(s,'status','status'); idx(s,'created_at','created_at'); idx(s,'order_no','order_no',{unique:true}); idx(s,'device_code','device_code'); idx(s,'tenant_branch_status',['tenant_id','branch_id','status']);}}; r.onsuccess=()=>{database=r.result; resolve(database);}; r.onerror=()=>reject(r.error||new Error('indexeddb_open_failed')); }); }
    async function getAll(store){const db=await openDb(); return req(db.transaction(store,'readonly').objectStore(store).getAll());}
    async function put(store,record){const db=await openDb(); return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(record); tx.oncomplete=()=>resolve(record); tx.onerror=()=>reject(tx.error||new Error('indexeddb_write_failed'));});}
    function html(v){return String(v).replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function txt(item,keys,fallback){for(const k of keys){if(typeof item[k]==='string'&&item[k].trim()) return item[k].trim();} return fallback||'-';}
    function num(item,keys,fallback){for(const k of keys){const v=Number(item[k]); if(Number.isFinite(v)&&v>=0) return v;} return fallback||0;}
    function normalize(item,i){return {id:txt(item,['id','product_id','sku','code'],'offline-product-'+(i+1)), sku:txt(item,['sku','code','barcode'],''), name:txt(item,['name','product_name','name_th','title','display_name'],'สินค้า '+(i+1)), category:txt(item,['category','category_name','menu_category','group_name'],'ทั่วไป'), price:num(item,['price','sale_price','selling_price','unit_price','retail_price','price_amount'],0)};}
    function safe(v,f){return String(v||f||'DEVICE').trim().replace(/[^a-z0-9_-]+/giu,'-').replace(/^-+|-+$/g,'').toUpperCase()||'DEVICE';}
    function bizDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
    function orderNo(){const d=bizDate(), c=d.replace(/-/g,''), device=safe(snapshot?.device_code||localStorage.getItem('cpi_windows_runtime_store_code_v1'),'POS-DEVICE'), branch=snapshot?.branch_code?safe(snapshot.branch_code,'')+'-':''; const key=`${COUNTER_PREFIX}:${branch}${device}:${c}`; const next=Number(localStorage.getItem(key)||'0')+1; localStorage.setItem(key,String(next)); return {order_no:`OFF-${branch}${device}-${c}-${String(next).padStart(6,'0')}`, local_sequence:next, local_business_date:d};}
    async function loadSnapshot(){try{if(!('indexedDB'in window)) throw new Error('เครื่องนี้ไม่รองรับ IndexedDB'); const snaps=await getAll(STORE_CATALOG); snapshot=snaps.sort((a,b)=>String(b.saved_at||'').localeCompare(String(a.saved_at||'')))[0]||null; if(!snapshot){products=[]; setStatus('error','ยังไม่มี catalog snapshot ในเครื่อง กรุณาต่อเน็ต เข้าเมนูหน้าขาย และรอให้สินค้าโหลดครบก่อน'); renderAll(); return;} products=(snapshot.products||[]).map(normalize); const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort(); el('category').innerHTML='<option value="">ทุกหมวดหมู่</option>'+cats.map(c=>`<option value="${html(c)}">${html(c)}</option>`).join(''); el('snapshotInfo').textContent=`Snapshot: ${new Date(snapshot.saved_at).toLocaleString('th-TH')} / สินค้า ${products.length} รายการ`; setStatus('ok',`โหลดข้อมูล offline สำเร็จ: ${products.length} รายการ`); renderAll();}catch(e){setStatus('error','โหลด Offline POS ไม่สำเร็จ: '+(e?.message||e));}}
    function filtered(){const q=el('search').value.trim().toLowerCase(), cat=el('category').value; return products.filter(p=>(!cat||p.category===cat)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));}
    function renderProducts(){el('products').innerHTML=filtered().map(p=>`<button class="product" data-id="${html(p.id)}"><strong>${html(p.name)}</strong><div class="price">${money(p.price)}</div><div class="meta">${html(p.category||'ทั่วไป')} ${p.sku?' / '+html(p.sku):''}</div></button>`).join(''); document.querySelectorAll('.product').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.id)));}
    function addToCart(id){const p=products.find(x=>x.id===id); if(!p)return; const e=cart.find(x=>x.id===id); if(e)e.quantity+=1; else cart.push({...p,quantity:1}); renderCart();}
    function changeQty(id,delta){const item=cart.find(x=>x.id===id); if(!item)return; item.quantity+=delta; cart=cart.filter(x=>x.quantity>0); renderCart();}
    function renderCart(){if(!cart.length) el('cartList').innerHTML='<div class="empty">ยังไม่มีสินค้าในตะกร้า</div>'; else el('cartList').innerHTML=cart.map(i=>`<div class="cart-row"><div><strong>${html(i.name)}</strong><div class="small">${money(i.price)} x ${i.quantity}</div><button class="ghost" onclick="changeQty('${html(i.id)}',-1)">-</button> <button class="ghost" onclick="changeQty('${html(i.id)}',1)">+</button></div><strong>${money(i.price*i.quantity)}</strong></div>`).join(''); const total=cart.reduce((s,i)=>s+i.price*i.quantity,0), qty=cart.reduce((s,i)=>s+i.quantity,0), cash=Number(el('cash').value||0); el('itemCount').textContent=String(qty); el('total').textContent=money(total); el('change').textContent=money(Math.max(0,cash-total));}
    function totals(){const subtotal=cart.reduce((s,i)=>s+i.price*i.quantity,0), cash=Number(el('cash').value||0); return {subtotal,discount_amount:0,tax_total:0,total_amount:subtotal,cash_received:cash,change_amount:Math.max(0,cash-subtotal)};}
    async function saveSale(){const total=totals(); if(!snapshot) throw new Error('ยังไม่มี snapshot'); if(!cart.length) throw new Error('ยังไม่มีสินค้าในตะกร้า'); if(total.cash_received<total.total_amount) throw new Error('รับเงินสดน้อยกว่ายอดรวม'); const r=orderNo(), t=new Date().toISOString(); const sale={id:'offline_sale_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),tenant_id:snapshot.tenant_id||'offline-tenant',branch_id:snapshot.branch_id||'offline-branch',branch_code:snapshot.branch_code||null,shift_id:null,user_id:'offline-cashier',device_id:null,device_code:snapshot.device_code||'POS-DEVICE',seller_name:'Offline cashier',order_no:r.order_no,order_type:'takeaway',table_id:null,items:cart.map(i=>({product_id:i.id,sku:i.sku||null,name:i.name,category:i.category||null,quantity:i.quantity,unit_price:i.price,line_total:i.price*i.quantity,notes:null,tax_lines:[]})),totals:total,receipt_html:null,metadata:{source:'offline-pos-html',snapshot_id:snapshot.id,requires_sync:true},local_sequence:r.local_sequence,local_business_date:r.local_business_date,payment_method:'cash',status:'queued',created_at:t,updated_at:t,sync_attempts:0,last_sync_attempt_at:null,last_sync_error:null,server_order_id:null,synced_at:null,void_reason:null}; await put(STORE_SALES,sale); return sale;}
    async function handleSave(){const box=el('saleResult'); box.className='empty'; box.textContent='กำลังบันทึก...'; try{const sale=await saveSale(); cart=[]; el('cash').value=''; renderCart(); box.className='ok'; box.textContent='บันทึกบิล Offline สำเร็จ: '+sale.order_no+' รอ sync เมื่อเน็ตกลับมา';}catch(e){box.className='error'; box.textContent=e?.message||String(e);}}
    function renderAll(){renderProducts(); renderCart();}
    el('reload').addEventListener('click',loadSnapshot); el('search').addEventListener('input',renderProducts); el('category').addEventListener('change',renderProducts); el('cash').addEventListener('input',renderCart); el('clearCart').addEventListener('click',()=>{cart=[];renderCart();}); el('saveSale').addEventListener('click',handleSave); el('goOnline').addEventListener('click',()=>{location.href='/login/store';}); renderCart(); loadSnapshot();
  </script>
</body>
</html>
