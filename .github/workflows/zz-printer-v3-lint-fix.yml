name: Printer v3 lint fixer
on:
  push:
    branches: [agent-docs-preflight-schema-drift]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'chore: run printer v3 lint fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-docs-preflight-schema-drift
      - name: Apply narrow rename
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in [
              'apps/backoffice-web/src/components/backoffice/printer-connection-manager-v2.tsx',
              'apps/backoffice-web/src/components/backoffice/printer-connection-manager-v3.tsx',
          ]:
              p=Path(rel)
              s=p.read_text(encoding='utf-8-sig')
              s=s.replace('useCandidate', 'applyCandidate')
              p.write_text(s, encoding='utf-8')
          Path('.github/workflows/zz-printer-v3-lint-fix.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/backoffice-web/src/components/backoffice/printer-connection-manager-v2.tsx apps/backoffice-web/src/components/backoffice/printer-connection-manager-v3.tsx .github/workflows/zz-printer-v3-lint-fix.yml
          git commit -m 'fix(printers): avoid hook-like candidate helper name'
          git push origin HEAD:agent-docs-preflight-schema-drift
