name: Cleanup Android shift popup center once

on:
  push:
    branches:
      - fix/android-shift-popup-center-20260817

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-shift-popup-center-20260817
      - name: Normalize toast width utility
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/backoffice-web/src/components/pos/pos-shift-cycle-guard-core.tsx")
          text = path.read_text(encoding="utf-8")
          old = "w-[min(480px,calc(100%-24px))]"
          new = "w-[min(480px,100%)]"
          if old not in text:
              raise SystemExit("toast width target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/cleanup-android-shift-popup-center-once.yml").unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backoffice-web/src/components/pos/pos-shift-cycle-guard-core.tsx .github/workflows/cleanup-android-shift-popup-center-once.yml
          git commit -m "fix(pos): normalize shift popup toast width"
          git push origin HEAD:fix/android-shift-popup-center-20260817
