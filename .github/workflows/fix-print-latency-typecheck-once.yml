name: Fix print latency typecheck once
on:
  push:
    branches: [fix/print-latency-receipt-spacing-stability-20260817]
    paths: [.github/workflows/fix-print-latency-typecheck-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-latency-receipt-spacing-stability-20260817
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/backoffice-web/src/components/pos/pos-sales-module.tsx')
          s=p.read_text()
          old='if (response.ok && method === "POST") {'
          new='if (response.ok && String(init.method ?? "GET").toUpperCase() === "POST") {'
          if s.count(old)!=1:
              raise SystemExit(f'expected 1 anchor, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/fix-print-latency-typecheck-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(pos): wake native print agent with scoped request method"
          git push origin HEAD:fix/print-latency-receipt-spacing-stability-20260817
