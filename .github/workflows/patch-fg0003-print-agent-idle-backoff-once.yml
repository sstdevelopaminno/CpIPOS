name: Patch FG0003 print-agent idle backoff once

on:
  push:
    branches:
      - hotfix/fg0003-print-agent-idle-backoff-20260826
    paths:
      - .github/workflows/patch-fg0003-print-agent-idle-backoff-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/fg0003-print-agent-idle-backoff-20260826
          fetch-depth: 0
      - name: Apply narrow Android Print Agent idle-backoff patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/pos-android/app/src/main/java/com/cpipos/pos/PosPrintAgent.kt')
          text = path.read_text()

          replacements = [
              ('* - empty claims back off 1 -> 2 -> 3 seconds;', '* - empty claims back off 1 -> 3 -> 8 seconds;'),
              ('.put("claim_poll_policy", "adaptive_1_2_3s")', '.put("claim_poll_policy", "adaptive_1_3_8s")'),
              ('private val IDLE_BACKOFF_SECONDS = longArrayOf(1L, 2L, 3L)', 'private val IDLE_BACKOFF_SECONDS = longArrayOf(1L, 3L, 8L)'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          context = Path('context.md')
          note = '''\n\n## 2026-08-26 — FG0003 Print Agent idle polling hotfix\n- Android native Print Agent idle claim backoff changed from `1 -> 2 -> 3s` to `1 -> 3 -> 8s`.\n- Immediate `notifyPrintQueued()` wake and 350ms retry are preserved, so queue-producing POS actions still wake the worker immediately.\n- No sales, payment, QR ordering, Kitchen routing, print lease/ack/fail semantics, or database schema changes.\n- Goal: reduce idle `/api/print-agent/v1/jobs/claim` churn while preserving print pickup responsiveness.\n'''
          current = context.read_text()
          if '## 2026-08-26 — FG0003 Print Agent idle polling hotfix' not in current:
              context.write_text(current.rstrip() + note + '\n')
          PY

          rm .github/workflows/patch-fg0003-print-agent-idle-backoff-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/pos-android/app/src/main/java/com/cpipos/pos/PosPrintAgent.kt context.md .github/workflows/patch-fg0003-print-agent-idle-backoff-once.yml
          git diff --cached --check
          git commit -m "perf(android-print): back off idle claim polling"
          git push origin HEAD:hotfix/fg0003-print-agent-idle-backoff-20260826
