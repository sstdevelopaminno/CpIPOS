name: Repair repository mojibake once

on:
  push:
    branches:
      - repair/stability-green-20260827
    paths:
      - .github/workflows/repair-repository-mojibake-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/stability-green-20260827
          fetch-depth: 0

      - name: Repair deterministic UTF-8 mojibake
        run: node scripts/repair-repository-mojibake.mjs

      - name: Commit repaired text
        run: |
          if git diff --quiet; then
            echo "No repairable mojibake found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair repository Thai mojibake"
          git push origin HEAD:repair/stability-green-20260827
