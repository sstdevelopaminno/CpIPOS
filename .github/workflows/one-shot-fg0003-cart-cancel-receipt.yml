name: One-shot FG0003 cart cancel and receipt hotfix

on:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - .github/workflows/one-shot-fg0003-cart-cancel-receipt.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply FG0003 cancellation hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-docs-preflight-schema-drift
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused source patch
        run: python3 .github/scripts/apply_fg0003_cart_cancel_receipt.py
      - name: Typecheck focused app
        run: |
          corepack enable
          corepack pnpm -C . install --frozen-lockfile
          corepack pnpm --filter backoffice-web exec tsc -p tsconfig.json --noEmit --pretty false
      - name: Commit patch and cleanup
        run: |
          git config user.name "CpIPOS Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-fg0003-cart-cancel-receipt.yml
          git rm .github/scripts/apply_fg0003_cart_cancel_receipt.py
          git add apps/backoffice-web/src/components/pos-preview/pos-table-qr-global-alert.tsx \
                  apps/backoffice-web/src/components/pos/pos-sales-module.tsx \
                  apps/backoffice-web/src/app/api/pos/payments/route.ts \
                  apps/backoffice-web/src/lib/printing/routed-print-service.ts
          git commit -m "fix(pos): sync dine-in cancellations and mark cancelled receipts"
          git push origin HEAD:agent-docs-preflight-schema-drift
