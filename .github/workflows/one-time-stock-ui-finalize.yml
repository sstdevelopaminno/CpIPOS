name: One-time stock UI finalizer

on:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - .github/workflows/one-time-stock-ui-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent-docs-preflight-schema-drift
          fetch-depth: 0

      - name: Run finalizer
        run: python scripts/one_time_stock_ui_finalize.py

      - name: Commit docs and MDM refresh
        run: |
          git config user.name "SST-CRUD"
          git config user.email "sstdevelopaminno@gmail.com"
          git add README.md context.md docs/PRODUCT-MANAGEMENT-UI-CLEANUP-2026-08-11.md apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts .github/workflows/one-time-stock-ui-finalize.yml scripts/one_time_stock_ui_finalize.py
          git diff --cached --check
          git commit -m "docs(mdm): finalize stock header cleanup and refresh POS"
          git push origin HEAD:agent-docs-preflight-schema-drift
