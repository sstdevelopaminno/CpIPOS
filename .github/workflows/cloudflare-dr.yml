name: Cloudflare DR — build verification and optional incident notice

on:
  # One-time owner-requested outage-status deployment upon merge of the exact activation marker.
  # This does NOT publish the POS app, modify DNS, or route customer traffic.
  push:
    branches: [main]
    paths:
      - "ops/cloudflare-incident-worker/activate-status-20261110.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-dr.yml"
      - "ops/cloudflare-incident-worker/**"
      - "apps/backoffice-web/open-next.config.ts"
      - "apps/backoffice-web/wrangler.toml"
      - "apps/backoffice-web/package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      action:
        description: "Verify Cloudflare compatibility or deploy the independent incident notice"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy-status
          - deploy-pos-staging
      staging_confirmation:
        description: "Only for deploy-pos-staging: enter TEST-ONLY to acknowledge no live customer traffic"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-dr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-incident-worker:
    name: Verify isolated incident worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test ops/cloudflare-incident-worker/worker.test.mjs

  probe-pos-cloudflare-build:
    name: Probe OpenNext Cloudflare POS build (no deploy)
    if: github.event_name == 'pull_request' || inputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm and install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Verify Edge compatibility bridge preserves POS auth matcher
        run: node --test scripts/tests/cloudflare-standby-proxy.test.mjs
      - name: Build OpenNext worker (Cloudflare-only Edge compatibility bridge; never deploy)
        run: node scripts/cloudflare-standby-build.mjs
      - name: Report generated worker size
        if: success()
        run: |
          ls -lh apps/backoffice-web/.open-next/worker.js
          du -sh apps/backoffice-web/.open-next
      - name: Validate package with Wrangler dry-run (no credentials, no deployment)
        if: success()
        run: corepack pnpm --filter backoffice-web exec wrangler deploy --config wrangler.standby.toml --dry-run
      - name: Verify Cloudflare runtime locally (no credentials, no production writes)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/dr-cloudflare-local-smoke.test.mjs
          corepack pnpm --filter backoffice-web exec wrangler dev --config wrangler.standby.toml --local --ip 127.0.0.1 --port 8787 --inspector-port 9278 > /tmp/pos-cf-local.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          if ! node scripts/dr/cloudflare-local-smoke.mjs; then
            echo "::error::Local Cloudflare Worker smoke failed; POS Cloudflare staging remains blocked."
            tail -n 80 /tmp/pos-cf-local.log
            exit 1
          fi
      - name: Deployment policy
        if: always()
        run: echo "Cloudflare POS has NOT been deployed. Customer cutover requires staging tenant, runtime secrets, security and transaction acceptance."

  deploy-incident-status:
    name: Deploy independent status notice to workers.dev
    if: (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-status' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify-incident-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-standby
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Cloudflare account ID/API token missing from GitHub Secrets. No deployment was attempted."
            exit 1
          fi
      - name: Install locked CLI dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Deploy incident notice only (no DNS, POS or database changes)
        run: corepack pnpm --filter backoffice-web exec wrangler deploy --config ../../ops/cloudflare-incident-worker/wrangler.toml

  deploy-pos-staging:
    name: Explicit test-tenant-only POS Worker deployment
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-pos-staging' && github.ref == 'refs/heads/main'
    needs: verify-incident-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-pos-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CPI_DR_TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CPI_DR_TEST_SUPABASE_ANON_KEY }}
      CPI_DR_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CPI_DR_TEST_SUPABASE_SERVICE_ROLE_KEY }}
      CPI_DR_TEST_POS_SESSION_HANDOFF_SECRET: ${{ secrets.CPI_DR_TEST_POS_SESSION_HANDOFF_SECRET }}
      CPI_STAGING_CONFIRMATION: ${{ inputs.staging_confirmation }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Confirm isolated test-only deployment and required secret presence
        shell: bash
        run: |
          if [[ "$CPI_STAGING_CONFIRMATION" != "TEST-ONLY" ]]; then
            echo "::error::Must enter TEST-ONLY. Live customer traffic and production data are prohibited."
            exit 1
          fi
          for var in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY CPI_DR_TEST_SUPABASE_SERVICE_ROLE_KEY CPI_DR_TEST_POS_SESSION_HANDOFF_SECRET; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing configured staging secret name: $var. No deployment attempted."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Reject known production Supabase targets
        shell: bash
        run: |
          set -euo pipefail
          # Connected production data planes: never reuse in a staged public Worker.
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" == *"deejlitaivfnsbwqdugy"* || "$NEXT_PUBLIC_SUPABASE_URL" == *"wznixoeezgyhtwurcswb"* ]]; then
            echo "::error::Supabase URL belongs to an existing production project. Staging requires an independent test project."
            exit 1
          fi
          if [[ ! "$NEXT_PUBLIC_SUPABASE_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/?$ ]]; then
            echo "::error::Test Supabase URL is not a standard Supabase project HTTPS URL."
            exit 1
          fi
      - name: Build reviewed Cloudflare-only Edge runtime
        run: node scripts/cloudflare-standby-build.mjs
      - name: Validate bundle without publishing
        run: corepack pnpm --filter backoffice-web exec wrangler deploy --config wrangler.standby.toml --dry-run
      - name: Smoke test compiled runtime locally before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/tests/dr-cloudflare-local-smoke.test.mjs
          corepack pnpm --filter backoffice-web exec wrangler dev --config wrangler.standby.toml --local --ip 127.0.0.1 --port 8787 --inspector-port 9278 > /tmp/pos-cf-local.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" 2>/dev/null || true' EXIT
          if ! node scripts/dr/cloudflare-local-smoke.mjs; then
            echo "::error::Local Worker smoke failed. No staging deployment attempted."
            tail -n 80 /tmp/pos-cf-local.log
            exit 1
          fi
      - name: Disable any previously public staging route before updating code
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cpi-pos-standby-stage/subdomain"
          CODE=$(curl -sS -o /tmp/stage-route.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")
          if [[ "$CODE" == "404" ]]; then
            echo "Staging Worker does not exist yet; no route to disable."
          elif [[ "$CODE" == "200" ]]; then
            jq -e '.success == true' /tmp/stage-route.json >/dev/null
            if [[ "$(jq -r '.result.enabled // false' /tmp/stage-route.json)" == "true" ]]; then
              curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"enabled":false,"previews_enabled":false}' "$API" | jq -e '.success == true' >/dev/null
            fi
          else
            echo "::error::Cannot inspect staging route; HTTP $CODE. No deployment attempted."
            exit 1
          fi
      - name: Deploy staging Worker privately (workers.dev disabled; no customer traffic)
        run: corepack pnpm --filter backoffice-web exec wrangler deploy --config wrangler.standby.toml
      - name: Configure ALL test-only secrets before enabling any public route
        shell: bash
        run: |
          set -euo pipefail
          set +x
          printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | corepack pnpm --filter backoffice-web exec wrangler secret put NEXT_PUBLIC_SUPABASE_URL --config wrangler.standby.toml
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | corepack pnpm --filter backoffice-web exec wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --config wrangler.standby.toml
          printf '%s' "$CPI_DR_TEST_SUPABASE_SERVICE_ROLE_KEY" | corepack pnpm --filter backoffice-web exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config wrangler.standby.toml
          printf '%s' "$CPI_DR_TEST_POS_SESSION_HANDOFF_SECRET" | corepack pnpm --filter backoffice-web exec wrangler secret put POS_SESSION_HANDOFF_SECRET --config wrangler.standby.toml
      - name: Enable only test-stage workers.dev URL after all secret setup
        shell: bash
        run: |
          set -euo pipefail
          API_BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"enabled":true,"previews_enabled":false}' "$API_BASE/scripts/cpi-pos-standby-stage/subdomain" | jq -e '.success == true and .result.enabled == true' >/dev/null
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_BASE/subdomain" > /tmp/cpi-stage-account.json
          SUBDOMAIN=$(jq -r '.result.subdomain // empty' /tmp/cpi-stage-account.json)
          if [[ ! "$SUBDOMAIN" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid workers.dev subdomain. Disable stage URL manually in Cloudflare."
            exit 1
          fi
          URL="https://cpi-pos-standby-stage.$SUBDOMAIN.workers.dev/login/store"
          echo "Public TEST-only stage login: $URL"
          if ! curl -fLsS --max-time 20 --retry 3 --retry-delay 2 "$URL" | grep -qi 'CpIPOS'; then
            echo "::error::Staging login failed. Disabling test Worker URL."
            curl --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"enabled":false,"previews_enabled":false}' "$API_BASE/scripts/cpi-pos-standby-stage/subdomain" >/dev/null || true
            exit 1
          fi
          echo "STATUS=ISOLATED_TEST_STAGE_LOGIN_AVAILABLE; TRANSACTION_FAILOVER_NOT_ACCEPTED"
      - name: Post-deployment warning
        run: |
          echo "Only workers.dev staging is deployed. No DNS, Vercel alias, customer app URL or production payment callback was changed."
          echo "Do not route real POS traffic until isolated Auth/KDS/Pay/Print/MDM tests and Cloudflare CPU/size checks pass."
