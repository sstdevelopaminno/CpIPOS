name: Patch Android Modern 1.0.22 release once

on:
  push:
    branches:
      - release/android-modern-1.0.22-code30-print-agent
    paths:
      - .github/workflows/patch-modern-1-0-22-release-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/android-modern-1.0.22-code30-print-agent
          fetch-depth: 0
      - name: Bump Modern release metadata to 1.0.22 code 30
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match for {old!r}, got {count}")
              p.write_text(text.replace(old, new, 1))

          release = 'apps/backoffice-web/src/lib/android-runtime-release.ts'
          replace_once(release, 'versionName: "1.0.21"', 'versionName: "1.0.22"')
          replace_once(release, 'versionCode: 29', 'versionCode: 30')
          replace_once(release, 'releaseTag: "android-runtime-modern-1.0.21"', 'releaseTag: "android-runtime-modern-1.0.22"')
          replace_once(release, 'assetName: "CpIPOS-Android-POS-1.0.21.apk"', 'assetName: "CpIPOS-Android-POS-1.0.22.apk"')
          replace_once(release, 'manifestAssetName: "CpIPOS-Android-POS-1.0.21.manifest.json"', 'manifestAssetName: "CpIPOS-Android-POS-1.0.22.manifest.json"')

          workflow = '.github/workflows/build-android-modern-runtime.yml'
          replace_once(workflow, 'ANDROID_RUNTIME_VERSION: 1.0.21', 'ANDROID_RUNTIME_VERSION: 1.0.22')
          replace_once(workflow, 'ANDROID_RUNTIME_VERSION_CODE: "29"', 'ANDROID_RUNTIME_VERSION_CODE: "30"')
          replace_once(workflow, 'ANDROID_RUNTIME_RELEASE_TAG: android-runtime-modern-1.0.21', 'ANDROID_RUNTIME_RELEASE_TAG: android-runtime-modern-1.0.22')
          replace_once(workflow, 'ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS-1.0.21.apk', 'ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS-1.0.22.apk')
          replace_once(workflow, 'ANDROID_RUNTIME_MANIFEST_ASSET_NAME: CpIPOS-Android-POS-1.0.21.manifest.json', 'ANDROID_RUNTIME_MANIFEST_ASSET_NAME: CpIPOS-Android-POS-1.0.22.manifest.json')
          replace_once(workflow, 'name: Build Android Modern 1.0.21 code 29', 'name: Build Android Modern 1.0.22 code 30')
          PY

          rm .github/workflows/patch-modern-1-0-22-release-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backoffice-web/src/lib/android-runtime-release.ts .github/workflows/build-android-modern-runtime.yml .github/workflows/patch-modern-1-0-22-release-once.yml
          git diff --cached --check
          git commit -m "release(android): prepare Modern 1.0.22 code 30"
          git push origin HEAD:release/android-modern-1.0.22-code30-print-agent
