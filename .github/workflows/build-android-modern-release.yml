name: Build CpIPOS Android Modern Release 1.0.17

on:
  workflow_dispatch:
  push:
    branches:
      - dev/android-modern-release-1-0-17-900001
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-modern-release.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.17
  ANDROID_RUNTIME_VERSION_CODE: "23"
  ANDROID_RUNTIME_RELEASE_TAG: android-runtime-modern-1.0.17
  ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS-1.0.17.apk
  ANDROID_RUNTIME_COMPAT_ASSET_NAME: CpIPOS-Android-POS-Modern.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-modern-release:
    name: Build and publish Android Modern 1.0.17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require stable signing secrets
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Stable signing secrets are required for the Modern release."
          exit 1

      - name: Materialize and validate signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"

          certSha=$(keytool -list -v \
            -keystore "$keystorePath" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')

          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Signing certificate mismatch. Expected ${{ env.ANDROID_SIGNING_CERT_SHA256 }}, got $certSha"
            exit 1
          fi
          echo "Stable signing certificate verified: $certSha"

      - name: Build signed Modern release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        env:
          CPIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-android-signing/cpipos-android-release.jks
          CPIPOS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CPIPOS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CPIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Verify and stage signed APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          apkPath="${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/release/app-release.apk"
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -f "$apkPath"

          apkSize=$(stat -c%s "$apkPath")
          if [ "$apkSize" -lt 1000000 ]; then
            echo "APK size looks too small: $apkSize bytes"
            exit 1
          fi

          badging=$("$aaptPath" dump badging "$apkPath" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${{ env.ANDROID_RUNTIME_VERSION_CODE }}'"
          echo "$badging" | grep -q "versionName='${{ env.ANDROID_RUNTIME_VERSION }}'"

          "$apksignerPath" verify --verbose --print-certs "$apkPath"
          certSha=$("$apksignerPath" verify --print-certs "$apkPath" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "APK certificate mismatch. Expected ${{ env.ANDROID_SIGNING_CERT_SHA256 }}, got $certSha"
            exit 1
          fi

          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_COMPAT_ASSET_NAME }}"
          sha256sum "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}" > "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}.sha256"
          echo "Modern signed APK ready: $apkSize bytes; certificate=$certSha"

      - name: Upload signed workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.17-modern-signed
          path: |
            artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_COMPAT_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}.sha256
          if-no-files-found: error

      - name: Publish immutable Modern release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/android-modern-release-1-0-17-900001' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_RELEASE_TAG }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to mutate an immutable Modern tag."
            exit 1
          fi

          gh release create "$tag" \
            "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}" \
            "artifacts/${{ env.ANDROID_RUNTIME_COMPAT_ASSET_NAME }}" \
            "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}.sha256" \
            --target "${{ github.sha }}" \
            --title "CpIPOS Android POS Modern 1.0.17" \
            --notes "Opt-in Modern Runtime release. Stable 1.0.12 and legacy stores remain on their existing release channels. Includes capability-gated printer verification and non-forced managed update notices. No silent installation and no automatic reassignment of existing printers."

          echo "Modern APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
