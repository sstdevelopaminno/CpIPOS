          app_readme = '''# CpIPOS POS - Android Tablet

`apps/pos-android` is the managed Android Tablet POS runtime for the shared CpIPOS Web POS reference UI.

## Version 1.0.0 baseline

- Package: `com.cpipos.pos`
- Runtime: hardened Android WebView shell using the shared Web POS UI/business APIs
- Default URL: `https://cp-ipos-web.vercel.app/login/store`
- Product/file selection: Android System Document Picker (Photos, Files, Google Drive and compatible providers)
- Storage model: scoped app/WebView storage; no broad `MANAGE_EXTERNAL_STORAGE` permission
- Printer readiness: network + Bluetooth/Nearby + USB-host capability declarations
- MDM: app-level heartbeat/diagnostics plus Android Device Admin / Device Owner enrollment foundation
- Launcher icon: copied from the canonical CpIPOS Web App 512px icon
- Server remains authoritative for tenant/branch/device/session/order/payment/stock rules

## Managed-device provisioning

Device Admin can be activated interactively. Full Android Enterprise Device Owner provisioning must be done on a freshly provisioned/factory-reset managed POS device, for example during IT enrollment. The IT Admin control plane must authorize and audit destructive/device-wide policies before they are enabled.

The app deliberately does **not** request Android All-files access and does not expose remote shell/wipe through the public MDM-lite heartbeat endpoint.

## Build

Requires JDK 17 and Android SDK 34.

```bash
cd apps/pos-android
gradle :app:assembleDebug
```

GitHub Actions workflow `.github/workflows/build-android-runtime.yml` validates PR builds and publishes the latest APK on the production integration branch. `/download/android/latest` continues to resolve the compatibility asset `CpIPOS-Android-debug.apk`; the release also includes `CpIPOS-Android-POS-1.0.0.apk`.
'''
