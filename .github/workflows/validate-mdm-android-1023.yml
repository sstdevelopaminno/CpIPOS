name: Validate Android Full MDM 1.0.23

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - "apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
      - "apps/backoffice-web/src/lib/mdm/eligibility.ts"
      - "apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"
      - "apps/backoffice-web/tests/unit/mdm/eligibility.test.ts"
      - ".github/workflows/validate-mdm-android-1023.yml"
  push:
    branches:
      - main
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - "apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
      - "apps/backoffice-web/src/lib/mdm/eligibility.ts"
      - "apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"
      - "apps/backoffice-web/tests/unit/mdm/eligibility.test.ts"
      - ".github/workflows/validate-mdm-android-1023.yml"

permissions:
  contents: read

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.23
  ANDROID_RUNTIME_VERSION_CODE: "32"

jobs:
  validate-full-mdm-runtime:
    name: Compile and test Android 1.0.23 Full MDM candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Full MDM source contract
        run: |
          agent="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/FullMdmAgent.kt"
          android_bridge="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/PosMdmAgent.kt"
          admin_policy="${ANDROID_RUNTIME_MODULE}/app/src/main/res/xml/cpipos_device_admin.xml"
          transport="apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
          eligibility="apps/backoffice-web/src/lib/mdm/eligibility.ts"
          heartbeat="apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"

          grep -qF -- 'private const val FULL_MDM_VERSION = "1.0.23"' "$agent"
          grep -qF -- '.put("full_mdm", fullMdmAgent.snapshot())' "$android_bridge"
          grep -qF -- '.put("full_mdm_results", fullMdmAgent.pendingResults())' "$android_bridge"
          grep -qF -- 'capabilities.put("remote_lock")' "$agent"
          grep -qF -- 'manager.lockNow()' "$agent"
          grep -qF -- '<force-lock />' "$admin_policy"
          grep -qF -- '"lock_device"' "$transport"
          grep -qF -- "allowedCommands.push('lock_device')" "$eligibility"
          grep -qF -- 'syncFullMdmHeartbeat' "$heartbeat"
          grep -qF -- 'operational_plane: "CpiPOS-001"' "$heartbeat"
          grep -qF -- 'authority: "CpiPOS-001.mdm_commands"' "$heartbeat"

          if grep -qF -- 'syncAndroidHeartbeatToItPlane' "$heartbeat"; then
            echo "POS Full MDM heartbeat must not depend on the reserved secondary control plane"
            exit 1
          fi
          if grep -qF -- 'CpiPOS-002' "$heartbeat"; then
            echo "CpiPOS-002 must not be part of the active POS/MDM runtime path"
            exit 1
          fi

          grep -qF -- 'capabilities.put("app_uninstall")' "$agent"
          grep -qF -- 'packageInstaller.uninstall(packageName, receiver.intentSender)' "$agent"
          grep -qF -- 'MdmUninstallResultReceiver' "$agent"
          grep -qF -- '"uninstall_app"' "$transport"
          grep -qF -- 'REQUEST_DELETE_PACKAGES' "${ANDROID_RUNTIME_MODULE}/app/src/main/AndroidManifest.xml"
          grep -qF -- 'android:exported="false"' "${ANDROID_RUNTIME_MODULE}/app/src/main/AndroidManifest.xml"

          print_transport="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/NativePrintTransport.kt"
          print_agent="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/PosPrintAgent.kt"
          grep -qF -- 'NETWORK_ESC_POS' "$print_transport"
          grep -qF -- 'LOCAL_BRIDGE' "$print_transport"
          grep -qF -- 'BLUETOOTH_BRIDGE' "$print_transport"
          grep -qF -- 'usb_printer_ambiguous' "$print_transport"
          grep -qF -- 'bluetooth_printer_not_paired' "$print_transport"
          grep -qF -- 'IDLE_BACKOFF_SECONDS = longArrayOf(1L, 3L, 8L, 15L, 30L)' "$print_agent"
          grep -qF -- 'wakeBurstPending' "$print_agent"
          grep -qF -- 'PREF_PRINTED_JOB_LEDGER = "printed_job_ledger_v1"' "$print_agent"
          grep -qF -- 'WAKE_RETRY_DELAY_MS = 350L' "$print_agent"
          grep -qF -- '/api/print-agent/v1/jobs/claim' "$print_agent"
          grep -qF -- '/ack' "$print_agent"
          grep -qF -- '/fail' "$print_agent"

          for capability in remote_unlock financing_lock revoke_access; do
            if grep -qF -- "capabilities.put(\"${capability}\")" "$agent"; then
              echo "${capability} must not be advertised before its executor is validated"
              exit 1
            fi
          done

      - name: Run Android unit tests as 1.0.23 candidate
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Compile Android 1.0.23 debug APK
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:assembleDebug
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          apkPath="${ANDROID_RUNTIME_MODULE}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apkPath"
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aaptPath"
          badging=$("$aaptPath" dump badging "$apkPath" | head -n 1)
          echo "$badging" | grep -q "package: name='com.cpipos.pos'"
          echo "$badging" | grep -q "versionCode='${ANDROID_RUNTIME_VERSION_CODE}'"
          echo "$badging" | grep -q "versionName='${ANDROID_RUNTIME_VERSION}'"
          "$aaptPath" dump permissions "$apkPath" | grep -q "android.permission.REQUEST_DELETE_PACKAGES"
          "$aaptPath" dump xmltree "$apkPath" AndroidManifest.xml | grep -q "MdmUninstallResultReceiver"
          echo "Android Full MDM 1.0.23 code ${ANDROID_RUNTIME_VERSION_CODE} candidate compiled successfully."

      - name: Upload debug APK for physical-device validation
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.23-code32-MDM-FINAL-RC-DEBUG
          path: ${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7