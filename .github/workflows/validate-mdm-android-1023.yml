name: Validate Android Full MDM 1.0.23

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mdm-phase2-primary-forwardport-20260917
    paths:
      - "apps/pos-android/**"
      - "apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
      - "apps/backoffice-web/src/lib/mdm/eligibility.ts"
      - "apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"
      - "apps/backoffice-web/tests/unit/mdm/eligibility.test.ts"
      - ".github/workflows/validate-mdm-android-1023.yml"

permissions:
  contents: read

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.23
  ANDROID_RUNTIME_VERSION_CODE: "31"

jobs:
  validate-full-mdm-runtime:
    name: Compile and test Android 1.0.23 Full MDM candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Full MDM source contract
        run: |
          agent="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/FullMdmAgent.kt"
          android_bridge="${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/PosMdmAgent.kt"
          admin_policy="${ANDROID_RUNTIME_MODULE}/app/src/main/res/xml/cpipos_device_admin.xml"
          transport="apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
          eligibility="apps/backoffice-web/src/lib/mdm/eligibility.ts"
          heartbeat="apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"

          grep -qF -- 'private const val FULL_MDM_VERSION = "1.0.23"' "$agent"
          grep -qF -- '.put("full_mdm", fullMdmAgent.snapshot())' "$android_bridge"
          grep -qF -- '.put("full_mdm_results", fullMdmAgent.pendingResults())' "$android_bridge"
          grep -qF -- 'capabilities.put("remote_lock")' "$agent"
          grep -qF -- 'manager.lockNow()' "$agent"
          grep -qF -- '<force-lock />' "$admin_policy"
          grep -qF -- '"lock_device"' "$transport"
          grep -qF -- "allowedCommands.push('lock_device')" "$eligibility"
          grep -qF -- 'syncFullMdmHeartbeat' "$heartbeat"
          grep -qF -- 'operational_plane: "CpiPOS-001"' "$heartbeat"
          grep -qF -- 'authority: "CpiPOS-001.mdm_commands"' "$heartbeat"

          if grep -qF -- 'syncAndroidHeartbeatToItPlane' "$heartbeat"; then
            echo "POS Full MDM heartbeat must not depend on the reserved secondary control plane"
            exit 1
          fi
          if grep -qF -- 'CpiPOS-002' "$heartbeat"; then
            echo "CpiPOS-002 must not be part of the active POS/MDM runtime path"
            exit 1
          fi

          for capability in remote_unlock financing_lock revoke_access app_uninstall; do
            if grep -qF -- "capabilities.put(\"${capability}\")" "$agent"; then
              echo "${capability} must not be advertised before its executor is validated"
              exit 1
            fi
          done

      - name: Run Android unit tests as 1.0.23 candidate
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Compile Android 1.0.23 debug APK
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:assembleDebug
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -f "${ANDROID_RUNTIME_MODULE}/app/build/outputs/apk/debug/app-debug.apk"
          echo "Android Full MDM 1.0.23 primary-only candidate compiled successfully."

      - name: Upload debug APK for physical-device validation
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.23-MDM-PRIMARY-RC-DEBUG
          path: ${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
