name: Validate Android Full MDM 1.0.23

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mdm-phase2-command-transport-20260914
    paths:
      - "apps/pos-android/**"
      - "apps/backoffice-web/src/lib/android-pos/full-mdm-transport.ts"
      - "apps/backoffice-web/src/app/api/android-pos/mdm/heartbeat/route.ts"
      - ".github/workflows/validate-mdm-android-1023.yml"

permissions:
  contents: read

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.23
  ANDROID_RUNTIME_VERSION_CODE: "31"

jobs:
  validate-full-mdm-runtime:
    name: Compile and test Android 1.0.23 Full MDM candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Full MDM source contract
        run: |
          grep -qF -- 'private const val FULL_MDM_VERSION = "1.0.23"' "${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/FullMdmAgent.kt"
          grep -qF -- '.put("full_mdm", fullMdmAgent.snapshot())' "${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/PosMdmAgent.kt"
          grep -qF -- '.put("full_mdm_results", fullMdmAgent.pendingResults())' "${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/PosMdmAgent.kt"
          if grep -qF -- 'capabilities.put("remote_lock")' "${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/FullMdmAgent.kt"; then
            echo "remote_lock must not be advertised before its executor is validated"
            exit 1
          fi
          if grep -qF -- 'capabilities.put("app_uninstall")' "${ANDROID_RUNTIME_MODULE}/app/src/main/java/com/cpipos/pos/FullMdmAgent.kt"; then
            echo "app_uninstall must not be advertised before its executor is validated"
            exit 1
          fi

      - name: Run Android unit tests as 1.0.23 candidate
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Compile Android 1.0.23 debug APK
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:assembleDebug
          -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}"
          -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}"
          -PcpiposUpdateChannel=modern
          -PcpiposManagedUpdater=true
          -PcpiposDualScreen=true
          --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -f "${ANDROID_RUNTIME_MODULE}/app/build/outputs/apk/debug/app-debug.apk"
          echo "Android Full MDM 1.0.23 candidate compiled successfully."
