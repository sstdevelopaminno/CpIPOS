name: Append dine-in regression checkpoint docs

on:
  push:
    branches:
      - fix/payment-popup-dinein-kitchen-20260817
    paths:
      - .github/workflows/append-dinein-docs-once.yml

permissions:
  contents: write

jobs:
  append-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/payment-popup-dinein-kitchen-20260817
          fetch-depth: 0
      - name: Append README and context checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "Dine-in Kitchen + payment popup regression fix — 2026-08-17"
          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          if marker not in readme_text:
              readme.write_text(readme_text + """

          ## Dine-in Kitchen + payment popup regression fix — 2026-08-17

          - Production evidence showed repeated `POST /api/pos/sales` 500 responses matching Postgres `INVALID_ITEM_QTY` during dine-in POS edits/checkout.
          - Root causes were isolated to the dine-in path: the order-item quantity trigger rejected the intentional cancelled-line `quantity = 0` transition, and successful Kitchen auto-send remounted the POS entry boundary which could unmount an in-progress payment modal.
          - Primary migration `202608170003_fix_dine_in_cancelled_item_quantity.sql` and Trial mirror permit zero only for an existing positive line explicitly entering `cancelled`, while preserving tenant/branch/order/product/unit-price identity. Null, negative and ordinary zero quantities remain rejected.
          - Successful dine-in Kitchen auto-send now clears only persisted draft/active-order snapshots; the live POS component remains mounted, preserving checkout/payment modal state.
          - Existing 5-second dine-in Kitchen auto-send debounce, payment API semantics, Kitchen/printer routing, Android runtime, shift/session and tenant/branch authorization are unchanged.
          """, encoding="utf-8")

          context = Path("context.md")
          context_text = context.read_text(encoding="utf-8")
          if marker not in context_text:
              context.write_text(context_text + """

          ## Dine-in Kitchen + payment popup regression fix — 2026-08-17

          - Production `/api/pos/sales` POST 500s in the reported test window correlated with CpiPOS-001 `INVALID_ITEM_QTY` errors. `replace_queued_dine_in_order_tx` intentionally transitions removed dine-in lines to `quantity = 0` + `metadata.bill_line_state = cancelled` before Kitchen cancel routing, but the catalog-price trigger rejected all zero quantities.
          - Primary/Trial migration `202608170003` now permits zero only for UPDATE of an existing positive line explicitly entering `cancelled`, while tenant, branch, order, product and historical unit price must remain unchanged. Normal positive lines keep catalog-price enforcement; null/negative/ordinary zero remain blocked.
          - A second dine-in-specific issue was confirmed in `PosDineInCommitResetBoundary`: successful auto-send remounted `PosEntryGate`, which could tear down a payment modal opened at the same time. The boundary now clears persisted snapshots without remounting the live POS.
          - The payment review is still created only after `submitOrder` succeeds. The 5-second dine-in Kitchen auto-send cadence, transactional Kitchen/print routing, Android runtime, payment API semantics, session/shift gates and non-dine-in flows are unchanged.
          - Regression coverage locks the DB cancellation guard, checkout sequencing, Kitchen debounce and no-remount contract.
          """, encoding="utf-8")
          PY
          if git diff --quiet -- README.md context.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md context.md
          git commit -m 'docs: record dine-in Kitchen and checkout regression fix'
          git push origin HEAD:fix/payment-popup-dinein-kitchen-20260817
