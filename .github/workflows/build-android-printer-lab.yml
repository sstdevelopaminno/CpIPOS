name: Build CpIPOS Android Printer Lab 1.0.14

on:
  workflow_dispatch:
  push:
    branches:
      - dev/android-printer-capability-inventory-900001
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-printer-lab.yml"
  pull_request:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-printer-lab.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.14
  ANDROID_RUNTIME_VERSION_CODE: "20"
  ANDROID_RUNTIME_RELEASE_TAG: android-runtime-printer-lab-1-0-14
  ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS-1.0.14-Printer-Lab.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-printer-lab:
    name: Build Android 1.0.14 Printer Lab APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests with dual-screen config
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and validate signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"
          certSha=$(keytool -list -v -keystore "$keystorePath" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Signing certificate mismatch: $certSha"
            exit 1
          fi

      - name: Build signed printer-lab release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        env:
          CPIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-android-signing/cpipos-android-release.jks
          CPIPOS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CPIPOS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CPIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Build debug smoke APK when signing is unavailable
        if: steps.signing.outputs.ready != 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:assembleDebug --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Verify and stage signed 1.0.14 APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          apkPath="${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/release/app-release.apk"
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -f "$apkPath"
          badging=$("$aaptPath" dump badging "$apkPath" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${{ env.ANDROID_RUNTIME_VERSION_CODE }}'"
          echo "$badging" | grep -q "versionName='${{ env.ANDROID_RUNTIME_VERSION }}'"
          "$apksignerPath" verify --verbose --print-certs "$apkPath"
          certSha=$("$apksignerPath" verify --print-certs "$apkPath" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "APK certificate mismatch: $certSha"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"

      - name: Upload signed printer-lab artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.14-printer-lab-signed
          path: artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish isolated printer-lab prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/android-printer-capability-inventory-900001' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_RELEASE_TAG }}"
          apkPath="artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "CpIPOS Android POS 1.0.14 Printer Lab" \
              --notes "Development-only signed APK for store 900001 hardware capability discovery. Adds read-only USB/Bluetooth/vendor printer inventory to MDM diagnostics. It does not auto-assign, open, or print to discovered devices and is not part of the stable 1.0.12 rollout."
          fi
          gh release upload "$tag" "$apkPath" --clobber
          echo "Printer Lab APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
