name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - hotfix/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22

      - name: Setup pnpm
        timeout-minutes: 5
        run: corepack enable

      - name: Install dependencies
        timeout-minutes: 8
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        timeout-minutes: 6
        run: corepack pnpm run typecheck

      - name: Lint
        timeout-minutes: 8
        run: corepack pnpm run lint

      - name: Test
        timeout-minutes: 8
        run: corepack pnpm run test

      - name: CpiPOS-001 schema drift check
        timeout-minutes: 5
        run: corepack pnpm schema:drift

      - name: Audit migration history and safe release preflight tests
        timeout-minutes: 3
        run: node --test scripts/tests/*.test.mjs

      - name: Build backoffice (PR)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: corepack pnpm --filter backoffice-web build

      - name: Build backoffice (push)
        if: github.event_name == 'push'
        timeout-minutes: 10
        run: corepack pnpm --filter backoffice-web build

  rw-warehouse-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: rw_warehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rw_warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-test-only
      PGDATABASE: rw_warehouse_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run candidate SQL in synthetic PostgreSQL
        shell: bash
        run: bash docs/sql/tests/run-rw-warehouse-postgres.sh
