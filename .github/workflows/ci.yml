name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - agent-docs-preflight-schema-drift
      - release/pos-prod-base-20260828
  push:
    branches:
      - main
      - develop
      - agent-docs-preflight-schema-drift
      - hotfix/**
      - release/pos-stable-20260828

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22

      - name: Setup pnpm
        timeout-minutes: 5
        run: corepack enable

      - name: Install dependencies
        timeout-minutes: 8
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        timeout-minutes: 6
        run: corepack pnpm run typecheck

      - name: Lint
        timeout-minutes: 8
        run: corepack pnpm run lint

      - name: Test
        timeout-minutes: 8
        run: corepack pnpm run test

      - name: Primary schema drift check
        timeout-minutes: 5
        run: corepack pnpm schema:drift

      - name: CpiPOS-002 schema drift check
        timeout-minutes: 5
        run: corepack pnpm schema:drift:trial

      - name: Build backoffice (PR)
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: corepack pnpm --filter backoffice-web build

      - name: Build backoffice (push)
        if: github.event_name == 'push'
        timeout-minutes: 10
        run: corepack pnpm --filter backoffice-web build
