name: Patch POS polling once

on:
  push:
    branches:
      - fix/receipt-kitchen-print-ui-lag-20260817

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/receipt-kitchen-print-ui-lag-20260817
          fetch-depth: 0
      - name: Reduce redundant visible polling
        shell: python
        run: |
          from pathlib import Path

          sales = Path("apps/backoffice-web/src/components/pos/pos-sales-module.tsx")
          text = sales.read_text(encoding="utf-8")
          old = "const interval = window.setInterval(refreshTables, tableBrowserOpen ? 3000 : 3500);"
          new = "const interval = window.setInterval(refreshTables, tableBrowserOpen ? 5000 : 7000);"
          if old not in text:
              raise SystemExit("POS table polling target not found")
          sales.write_text(text.replace(old, new, 1), encoding="utf-8")

          kitchen = Path("apps/backoffice-web/src/components/kitchen/kitchen-kds.tsx")
          text = kitchen.read_text(encoding="utf-8")
          old = "const POLL_INTERVAL_MS = 2_000;"
          new = "const POLL_INTERVAL_MS = 3_000;"
          if old not in text:
              raise SystemExit("Kitchen polling target not found")
          kitchen.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit polling changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/backoffice-web/src/components/pos/pos-sales-module.tsx apps/backoffice-web/src/components/kitchen/kitchen-kds.tsx
          git diff --cached --quiet && exit 0
          git commit -m "perf(pos): reduce redundant table and kitchen polling"
          git push origin HEAD:fix/receipt-kitchen-print-ui-lag-20260817
