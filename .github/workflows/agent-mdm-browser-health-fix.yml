name: Agent MDM Browser Health Fix

on:
  push:
    branches:
      - agent/mdm-browser-health-classification-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/mdm-browser-health-classification-fix
          fetch-depth: 0

      - name: Apply MDM telemetry patch
        run: python .github/agent-mdm-browser-health-fix.py

      - name: Verify patch shape
        run: |
          git diff --check
          grep -n 'resolveDeviceMdmTelemetryProfile' apps/backoffice-web/src/lib/device-mdm-diagnostics.ts
          grep -n 'shouldEvaluateWindowsRuntime' apps/backoffice-web/src/lib/device-mdm-diagnostics.ts
          grep -n 'telemetry_profile: surface' apps/backoffice-web/src/lib/pos/device-heartbeat-client.ts
          test -f apps/backoffice-web/tests/unit/device-mdm-diagnostics.test.ts
          grep -n 'MDM telemetry profile hardening' README.md context.md

      - name: Commit patch and remove temporary helpers
        run: |
          rm -f .github/agent-mdm-browser-health-fix.py .github/workflows/agent-mdm-browser-health-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(mdm): classify heartbeat telemetry by runtime surface'
          git push origin HEAD:agent/mdm-browser-health-classification-fix
