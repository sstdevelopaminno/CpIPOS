name: Append fix handoff once

on:
  push:
    branches:
      - fix/receipt-kitchen-print-ui-lag-20260817

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/receipt-kitchen-print-ui-lag-20260817
          fetch-depth: 0
      - name: Append checkpoint
        run: |
          marker='## 2026-08-17 — Receipt / Kitchen dispatch / KDS / POS responsiveness fix'
          for file in README.md context.md; do
            if ! grep -Fq "$marker" "$file"; then
              cat >> "$file" <<'EOF'

## 2026-08-17 — Receipt / Kitchen dispatch / KDS / POS responsiveness fix

- Receipt HTML normalizes known legacy mojibake values on the `โหมด` line to readable Thai (`หน้าขาย` / `ใบเสร็จย้อนหลัง`) before rendering.
- Dine-in cart reconciliation now treats the first server snapshot as the committed baseline when the local baseline is not initialized. This prevents a server refresh from doubling unchanged local quantities and emitting a false Kitchen `add` round shortly before payment.
- Payment/receipt routing itself remains unchanged: customer receipt printing stays on the payment flow and legitimate Kitchen `new` / `add` / `cancel` events remain supported.
- Kitchen Management has a dedicated Owner/Manager-authorized `zone.kds` mutation. The KDS checkbox updates optimistically, reverts on failure, and no longer requires a full config reload to toggle the display system.
- Kitchen printer validation accepts either legacy `printer_role=kitchen` or an enabled multi-purpose profile that explicitly declares Kitchen capability in metadata.
- POS table polling was reduced from 3.0/3.5 seconds to 5/7 seconds and Kitchen queue polling from 2 to 3 seconds after production telemetry showed these routes among the highest-frequency interactive requests. Existing in-flight and visibility guards remain in place.
- No database migration, authorization relaxation, payment semantics change, or Android version/minSdk change is part of this fix.
- Validation is tracked in PR #104; merge only after Typecheck, Lint, Tests, Primary/Trial schema drift and Vercel Preview are green on the final head SHA.
EOF
            fi
          done
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md context.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: record receipt Kitchen and POS responsiveness fixes"
          git push origin HEAD:fix/receipt-kitchen-print-ui-lag-20260817
