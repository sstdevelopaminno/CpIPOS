name: Publish Windows Web POS 0.2.0 Printer MDM Beta

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-windows-webpos-mdm-beta.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-printer-mdm-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RELEASE_TAG: windows-webpos-v0.2.0-beta1
      SOURCE_RUN: "41810853384"
      SOURCE_COMMIT: "2b4ee54deaccfc5404fcd499583463055dc97fa4"
      VERIFIED_MAIN_COMMIT: "bb687bf4f798df54216dcad3ca82dab8b17aade5"
      EXPECTED_SIZE: "67204788"
      BINARY_NAME: CpIPOS-WindowsWebPOS-Setup.exe

    steps:
      - name: Verify previously green Windows Build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "sstdevelopaminno/CpIPOS"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          echo "$run_json" | jq -e --arg sha "$SOURCE_COMMIT" '.conclusion == "success" and .head_sha == $sha' >/dev/null
          git merge-base --is-ancestor "$VERIFIED_MAIN_COMMIT" HEAD

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify pinned Web POS installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-mdm-beta"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name "CpIPOS-WindowsRuntime" --dir "$RUNNER_TEMP/windows-mdm-beta"
          file="$RUNNER_TEMP/windows-mdm-beta/$BINARY_NAME"
          test -f "$file"
          test "$(stat -c%s "$file")" = "$EXPECTED_SIZE"
          file "$file" | grep -E 'PE32\+? executable|MS Windows'
          sha256sum "$file" | tee "$RUNNER_TEMP/windows-mdm-beta/SHA256SUMS.txt"

      - name: Publish a separate labelled test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace an existing beta release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/windows-mdm-beta/$BINARY_NAME" \
            "$RUNNER_TEMP/windows-mdm-beta/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_MAIN_COMMIT" \
            --title "CpIPOS Windows Web POS 0.2.0 Beta — XP-80C Printer MDM" \
            --prerelease \
            --notes "BETA TEST ONLY — Not approved for customer live sales. Adds authenticated per-machine selection of installed Windows printer queues (e.g. XP-80C) from CpIPOS IT MDM, with local per-user persistence. Remote selection changes the application queue preference and does not install drivers or change the Windows system default. Does NOT yet deliver queued server receipt jobs to Windows Print Agent: the legacy Android receipt profile must not be redirected blindly. No Authenticode signature. Physical 80mm Thai receipt and duplicate-prevention acceptance remain incomplete. Source Windows build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease
