name: Build CpIPOS Android Tablet POS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-runtime.yml"
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-runtime.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.20
  ANDROID_RUNTIME_VERSION_CODE: "27"
  ANDROID_RUNTIME_RELEASE_TAG: android-runtime-latest
  ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS.apk
  ANDROID_RUNTIME_LEGACY_ASSET_NAME: CpIPOS-Android-debug.apk
  ANDROID_RUNTIME_VERSIONED_ASSET_NAME: CpIPOS-Android-POS-1.0.20.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-android-runtime:
    name: Build Android Tablet POS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate stable source and version override support
        run: |
          buildFile="${{ env.ANDROID_RUNTIME_MODULE }}/app/build.gradle.kts"
          grep -qF -- 'versionName = "1.0.12"' "$buildFile" || { echo "stable source versionName must remain 1.0.12"; exit 1; }
          grep -qF -- 'versionCode = 18' "$buildFile" || { echo "stable source versionCode must remain 18"; exit 1; }
          grep -qF -- 'minSdk = 26' "$buildFile" || { echo "minSdk must remain 26"; exit 1; }
          grep -qF -- 'providers.gradleProperty("cpiposVersionName")' "$buildFile" || { echo "cpiposVersionName override missing"; exit 1; }
          grep -qF -- 'providers.gradleProperty("cpiposVersionCode")' "$buildFile" || { echo "cpiposVersionCode override missing"; exit 1; }

      - name: Run Android print unit tests
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and validate stable signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"
          certSha=$(keytool -list -v -keystore "$keystorePath" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          [ "$certSha" = "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ] || { echo "Signing certificate mismatch: $certSha"; exit 1; }
          echo "Stable signing certificate verified: $certSha"

      - name: Build stable signed versioned release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        env:
          CPIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-android-signing/cpipos-android-release.jks
          CPIPOS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CPIPOS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CPIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}" -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}" --no-daemon --stacktrace

      - name: Build versioned debug smoke APK when signing is unavailable
        if: steps.signing.outputs.ready != 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: gradle :app:assembleDebug -PcpiposVersionName="${ANDROID_RUNTIME_VERSION}" -PcpiposVersionCode="${ANDROID_RUNTIME_VERSION_CODE}" --no-daemon --stacktrace

      - name: Require signing secrets for manual release
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready != 'true'
        run: exit 1

      - name: Locate, verify and stage signed APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          apkPath="${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/release/app-release.apk"
          [ -f "$apkPath" ] || { echo "Built release APK not found"; exit 1; }
          apkSize=$(stat -c%s "$apkPath")
          [ "$apkSize" -ge 1000000 ] || { echo "APK size looks too small: $apkSize"; exit 1; }
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          [ -n "$apksignerPath" ] && [ -n "$aaptPath" ] || { echo "Android verification tools missing"; exit 1; }
          "$apksignerPath" verify --verbose --print-certs "$apkPath"
          certSha=$("$apksignerPath" verify --print-certs "$apkPath" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$certSha" = "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ] || { echo "APK certificate mismatch"; exit 1; }
          badging=$("$aaptPath" dump badging "$apkPath" | head -n 1)
          echo "$badging" | grep -q "versionCode='${{ env.ANDROID_RUNTIME_VERSION_CODE }}'" || { echo "APK versionCode mismatch: $badging"; exit 1; }
          echo "$badging" | grep -q "versionName='${{ env.ANDROID_RUNTIME_VERSION }}'" || { echo "APK versionName mismatch: $badging"; exit 1; }
          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_LEGACY_ASSET_NAME }}"
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_VERSIONED_ASSET_NAME }}"
          sha256sum "artifacts/${{ env.ANDROID_RUNTIME_VERSIONED_ASSET_NAME }}" | tee artifacts/CpIPOS-Android-POS-1.0.20.sha256

      - name: Upload signed workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-${{ env.ANDROID_RUNTIME_VERSION }}-code${{ env.ANDROID_RUNTIME_VERSION_CODE }}-stable-signed
          path: |
            artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_LEGACY_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_VERSIONED_ASSET_NAME }}
            artifacts/CpIPOS-Android-POS-1.0.20.sha256
          if-no-files-found: error

      - name: Publish stable signed latest release download
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent-docs-preflight-schema-drift' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_RELEASE_TAG }}"
          apkPath="artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          legacyApkPath="artifacts/${{ env.ANDROID_RUNTIME_LEGACY_ASSET_NAME }}"
          versionedApkPath="artifacts/${{ env.ANDROID_RUNTIME_VERSIONED_ASSET_NAME }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.sha }}" --title "CpIPOS Android Tablet POS Latest" --notes "CpIPOS Android Tablet POS stable-signed managed-device release."
          fi
          gh release upload "$tag" "$apkPath" "$legacyApkPath" "$versionedApkPath" --clobber
