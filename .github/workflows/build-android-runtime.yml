name: Build CpIPOS Android Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 0.1.1
  ANDROID_RUNTIME_RELEASE_TAG: android-runtime-latest
  ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-debug.apk

jobs:
  build-android-runtime:
    name: Build Android Runtime APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android runtime version consistency
        run: |
          expected='versionName = "${{ env.ANDROID_RUNTIME_VERSION }}"'
          buildFile="${{ env.ANDROID_RUNTIME_MODULE }}/app/build.gradle.kts"
          if ! grep -qF -- "$expected" "$buildFile"; then
            echo "$buildFile versionName does not match ${{ env.ANDROID_RUNTIME_VERSION }}"
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and validate APK
        run: |
          apkPath="${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apkPath" ]; then
            echo "Built APK not found at $apkPath"
            exit 1
          fi
          apkSize=$(stat -c%s "$apkPath")
          if [ "$apkSize" -lt 1000000 ]; then
            echo "APK size looks too small: $apkSize bytes"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          echo "APK ready: artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }} ($apkSize bytes)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-Runtime
          path: artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish latest release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_RELEASE_TAG }}"
          apkPath="artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "CpIPOS Android Runtime Latest" \
              --notes "Latest CpIPOS Android Runtime debug APK built manually from GitHub Actions. Sideload only; not distributed through Google Play."
          fi

          gh release upload "$tag" "$apkPath" --clobber
          echo "APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
