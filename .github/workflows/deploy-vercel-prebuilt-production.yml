name: Production Deploy (Prebuilt)

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Check Vercel token and project access without building or deploying"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cpipos-production-prebuilt
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ZKmv6uQSU9QUyP08mxAr2YDI
  VERCEL_PROJECT_ID: prj_NLRmnCWPvQfSJZvoJE224zqVT4dj
  VERCEL_TEAM_SLUG: sstdevelopaminnos-projects
  VERCEL_PROJECT_ROOT: apps/backoffice-web

jobs:
  deploy:
    name: Build on GitHub and deploy prebuilt Production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployment requires manual workflow_dispatch on main, not $GITHUB_REF."
            exit 1
          fi
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Require Vercel deployment token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret VERCEL_TOKEN. Add a Vercel token with access to team sstdevelopaminnos-projects, then rerun this workflow."
            exit 1
          fi

      - name: Verify Vercel token and exact Production project (read-only)
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Probe the official REST API directly. The older "vercel api GET ..."
          # CLI form misparsed GET as an endpoint and emitted a misleading 404.
          response_path="${RUNNER_TEMP}/cpipos-vercel-project-preflight.json"
          if ! status="$(curl --silent --show-error --max-time 20 \
            --output "$response_path" --write-out "%{http_code}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"; then
            echo "::error::Could not reach Vercel project API. Check network and retry."
            exit 1
          fi
          case "$status" in
            200)
              if ! jq -e --arg project "$VERCEL_PROJECT_ID" '.id == $project' "$response_path" >/dev/null; then
                echo "::error::Vercel project ID does not match cp-ipos-web; refusing Production access."
                exit 1
              fi
              echo "Vercel token accepted for intended Production project: $VERCEL_PROJECT_ID"
              ;;
            401|403)
              echo "::error::VERCEL_TOKEN rejected or insufficiently scoped (HTTP $status). Update GitHub Actions secret VERCEL_TOKEN with a Vercel token authorized for team sstdevelopaminnos-projects. Do not paste credentials in logs/chat."
              exit 1
              ;;
            404)
              echo "::error::Vercel project unavailable to this token (HTTP 404). Verify VERCEL_TOKEN team scope and VERCEL_PROJECT_ID; project was not deleted by this job."
              exit 1
              ;;
            *)
              echo "::error::Vercel API preflight failed (HTTP $status). No Production change attempted."
              exit 1
              ;;
          esac

      - name: Confirm verify-only mode
        if: ${{ inputs.verify_only == true }}
        run: echo "Vercel credential/project check passed. Verify-only mode; no build or Production deploy."

      - name: Install Vercel CLI
        if: ${{ inputs.verify_only != true }}
        run: npm install --global vercel@latest

      - name: Link Production project explicitly
        if: ${{ inputs.verify_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf "$VERCEL_PROJECT_ROOT/.vercel"
          vercel link \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_TEAM_SLUG" \
            --token="$VERCEL_TOKEN" \
            --cwd="$VERCEL_PROJECT_ROOT"

      - name: Pull Production project settings and environment
        if: ${{ inputs.verify_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel pull
          --yes
          --environment=production
          --project="$VERCEL_PROJECT_ID"
          --scope="$VERCEL_TEAM_SLUG"
          --token="$VERCEL_TOKEN"
          --cwd="$VERCEL_PROJECT_ROOT"

      - name: Build Vercel output on GitHub runner
        if: ${{ inputs.verify_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_GIT_COMMIT_SHA: ${{ steps.source.outputs.sha }}
          VERCEL_GIT_COMMIT_REF: main
        run: >-
          vercel build
          --prod
          --project="$VERCEL_PROJECT_ID"
          --scope="$VERCEL_TEAM_SLUG"
          --token="$VERCEL_TOKEN"
          --cwd="$VERCEL_PROJECT_ROOT"

      - name: Deploy prebuilt output to Production
        if: ${{ inputs.verify_only != true }}
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --yes --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN" --cwd="$VERCEL_PROJECT_ROOT" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Verify Production build identity
        if: ${{ inputs.verify_only != true }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            payload=$(curl --fail --silent --show-error "https://cp-ipos-web.vercel.app/api/system/build-info" || true)
            echo "Production build-info attempt $attempt: $payload"
            if printf '%s' "$payload" | grep -q "$EXPECTED_SHA"; then
              echo "Production is serving expected commit $EXPECTED_SHA"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Production alias did not report expected commit $EXPECTED_SHA after deployment."
          exit 1
