name: Build CpIPOS Windows Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WINDOWS_RUNTIME_PROJECT: apps/windows-runtime-native/Cpipos.WindowsRuntime/Cpipos.WindowsRuntime.csproj
  WINDOWS_RUNTIME_ICON_B64: apps/windows-runtime-native/Cpipos.WindowsRuntime/assets/cpipos.ico.b64
  WINDOWS_RUNTIME_ICON: apps/windows-runtime-native/Cpipos.WindowsRuntime/assets/cpipos.ico
  WINDOWS_RUNTIME_OUTPUT: artifacts/CpIPOS-WindowsRuntime-win-x64
  WINDOWS_RUNTIME_ZIP: artifacts/CpIPOS-WindowsRuntime-win-x64.zip
  WINDOWS_RUNTIME_SETUP: artifacts/CpIPOS-WindowsRuntime-Setup.exe
  WINDOWS_RUNTIME_RELEASE_TAG: windows-runtime-latest
  WINDOWS_RUNTIME_SETUP_ASSET_NAME: CpIPOS-WindowsRuntime-Setup.exe
  WINDOWS_RUNTIME_ZIP_ASSET_NAME: CpIPOS-WindowsRuntime-win-x64.zip
  WINDOWS_RUNTIME_VERSION: 0.1.7

jobs:
  build-windows-runtime:
    name: Build Windows Runtime Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore app icon from repository
        shell: pwsh
        run: |
          if (!(Test-Path $env:WINDOWS_RUNTIME_ICON_B64)) {
            throw "Icon source not found: $env:WINDOWS_RUNTIME_ICON_B64"
          }

          $iconDir = Split-Path -Parent $env:WINDOWS_RUNTIME_ICON
          New-Item -ItemType Directory -Force -Path $iconDir | Out-Null

          $iconBase64 = (Get-Content $env:WINDOWS_RUNTIME_ICON_B64 -Raw).Trim()
          [System.IO.File]::WriteAllBytes($env:WINDOWS_RUNTIME_ICON, [Convert]::FromBase64String($iconBase64))

          if (!(Test-Path $env:WINDOWS_RUNTIME_ICON)) {
            throw "Icon was not restored: $env:WINDOWS_RUNTIME_ICON"
          }

          $finalBytes = [System.IO.File]::ReadAllBytes($env:WINDOWS_RUNTIME_ICON)
          if (!($finalBytes.Length -gt 6 -and $finalBytes[0] -eq 0 -and $finalBytes[1] -eq 0 -and $finalBytes[2] -eq 1 -and $finalBytes[3] -eq 0)) {
            throw "Final app icon is not a valid Windows .ico file: $env:WINDOWS_RUNTIME_ICON"
          }
          Write-Host "Using uploaded CpIPOS repository icon: $env:WINDOWS_RUNTIME_ICON ($($finalBytes.Length) bytes)"

      - name: Validate Windows runtime version consistency
        shell: pwsh
        run: |
          $expected = $env:WINDOWS_RUNTIME_VERSION
          $csproj = Get-Content $env:WINDOWS_RUNTIME_PROJECT -Raw
          $mainForm = Get-Content "apps/windows-runtime-native/Cpipos.WindowsRuntime/MainForm.cs" -Raw
          $bridge = Get-Content "apps/windows-runtime-native/Cpipos.WindowsRuntime/LocalPrintBridge.cs" -Raw
          $installer = Get-Content "apps/windows-runtime-native/installer/CpIPOSWindowsRuntime.iss" -Raw

          $csprojVersion = "<Version>$expected</Version>"
          $nativeAppVersion = 'native_app_version = "' + $expected + '"'
          $bridgeVersion = "cpipos-windows-native-bridge-$expected"
          $installerVersion = '#define AppVersion "' + $expected + '"'

          if (-not $csproj.Contains($csprojVersion)) { throw "csproj Version does not match $expected" }
          if (-not $mainForm.Contains($nativeAppVersion)) { throw "MainForm native_app_version does not match $expected" }
          if (-not $bridge.Contains($bridgeVersion)) { throw "LocalPrintBridge version does not match $expected" }
          if (-not $installer.Contains($installerVersion)) { throw "Installer default AppVersion does not match $expected" }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:WINDOWS_RUNTIME_PROJECT

      - name: Publish Windows x64 self-contained app
        shell: pwsh
        run: |
          dotnet publish $env:WINDOWS_RUNTIME_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o $env:WINDOWS_RUNTIME_OUTPUT

      - name: Bundle and validate CpIPOS icon
        shell: pwsh
        run: |
          $outputIconDir = Join-Path $env:WINDOWS_RUNTIME_OUTPUT "assets"
          $outputIcon = Join-Path $outputIconDir "cpipos.ico"
          $rootOutputIcon = Join-Path $env:WINDOWS_RUNTIME_OUTPUT "cpipos.ico"
          New-Item -ItemType Directory -Force -Path $outputIconDir | Out-Null
          Copy-Item -Force $env:WINDOWS_RUNTIME_ICON $outputIcon
          Copy-Item -Force $env:WINDOWS_RUNTIME_ICON $rootOutputIcon

          foreach ($path in @($outputIcon, $rootOutputIcon)) {
            if (!(Test-Path $path)) {
              throw "Bundled icon missing: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (!($bytes.Length -gt 6 -and $bytes[0] -eq 0 -and $bytes[1] -eq 0 -and $bytes[2] -eq 1 -and $bytes[3] -eq 0)) {
              throw "Bundled icon is not a valid Windows .ico file: $path"
            }
            Write-Host "Bundled icon ready: $path ($($bytes.Length) bytes)"
          }

          $exePath = Join-Path $env:WINDOWS_RUNTIME_OUTPUT "Cpipos.WindowsRuntime.exe"
          if (!(Test-Path $exePath)) {
            throw "Published app executable missing: $exePath"
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exePath)
          if ($null -eq $icon) {
            throw "Published executable did not return an associated icon: $exePath"
          }
          Write-Host "Published executable associated icon size: $($icon.Width)x$($icon.Height)"

      - name: Add README
        shell: pwsh
        run: |
          @'
          CpIPOS Windows Runtime
          ======================

          Recommended for customers:
            Run CpIPOS-WindowsRuntime-Setup.exe to install CpIPOS Windows Runtime.

          Store-code activation:
            CpIPOS Web, CpIPOS Windows, and future CpIPOS mobile apps use the same store code anchor.
            First activation must be unlocked by IT Backoffice package entitlement.
            Temporary NDL-TH-001 demo unlock requires WINDOWS_RUNTIME_ENABLE_DEMO_STORE_CODE on the server.

          Portable fallback:
            Extract CpIPOS-WindowsRuntime-win-x64.zip and run Cpipos.WindowsRuntime.exe.

          Optional command line:
            Cpipos.WindowsRuntime.exe --store-code=NDL-TH-001
            Cpipos.WindowsRuntime.exe --printer=MTP-II
            Cpipos.WindowsRuntime.exe --fullscreen
            Cpipos.WindowsRuntime.exe --windowed
            Cpipos.WindowsRuntime.exe --devtools
            Cpipos.WindowsRuntime.exe --url=http://localhost:3000/login/store --allow-custom-url

          Local bridge inside the app:
            http://127.0.0.1:3210/health
            http://127.0.0.1:3210/printers
            http://127.0.0.1:3210/print/status
            http://127.0.0.1:3210/print/test
            http://127.0.0.1:3210/print

          Bridge security:
          - /printers, /print/test, and /print require X-CpIPOS-Bridge-Token.
          - The token is generated per app launch and injected into the WebView session.
          - Production runtime URLs are restricted to https://cp-ipos-web.vercel.app unless --allow-custom-url is used for local development.

          Icon behavior:
          - CpIPOS uses the bundled assets/cpipos.ico for title bar and shortcuts.
          - The installer also installs cpipos.ico at the app root for fallback.
          - If Windows still shows the old icon after reinstall, clear Windows icon cache.

          Notes:
          - CpIPOS Web is still the main web app.
          - This package is the Windows runtime for Windows POS terminals.
          - It opens as a normal Windows window by default, with minimize/maximize/close controls.
          - It includes a native local print bridge with serialized print jobs.
          - Offline sales database and sync queue foundation are included as schema/contract only in this phase.
          '@ | Set-Content -Encoding UTF8 "$env:WINDOWS_RUNTIME_OUTPUT/README-WINDOWS-RUNTIME.txt"

      - name: Zip portable package
        shell: pwsh
        run: |
          if (Test-Path $env:WINDOWS_RUNTIME_ZIP) {
            Remove-Item -Force $env:WINDOWS_RUNTIME_ZIP
          }
          Compress-Archive -Path "$env:WINDOWS_RUNTIME_OUTPUT/*" -DestinationPath $env:WINDOWS_RUNTIME_ZIP -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          & $iscc `
            "apps/windows-runtime-native/installer/CpIPOSWindowsRuntime.iss" `
            "/DAppVersion=$env:WINDOWS_RUNTIME_VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\CpIPOS-WindowsRuntime-win-x64" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts" `
            "/DIconFile=$env:GITHUB_WORKSPACE\apps\windows-runtime-native\Cpipos.WindowsRuntime\assets\cpipos.ico"

          if (!(Test-Path $env:WINDOWS_RUNTIME_SETUP)) {
            throw "Installer was not created: $env:WINDOWS_RUNTIME_SETUP"
          }

      - name: Validate installer and packaged icon
        shell: pwsh
        run: |
          $setupPath = $env:WINDOWS_RUNTIME_SETUP
          if (!(Test-Path $setupPath)) {
            throw "Installer missing: $setupPath"
          }
          $setupSize = (Get-Item $setupPath).Length
          if ($setupSize -lt 1000000) {
            throw "Installer size looks too small: $setupSize bytes"
          }

          $outputIcon = Join-Path $env:WINDOWS_RUNTIME_OUTPUT "assets\cpipos.ico"
          $rootOutputIcon = Join-Path $env:WINDOWS_RUNTIME_OUTPUT "cpipos.ico"
          foreach ($path in @($outputIcon, $rootOutputIcon)) {
            if (!(Test-Path $path)) {
              throw "Release package icon missing before upload: $path"
            }
          }
          Write-Host "Installer ready with bundled CpIPOS icon: $setupPath ($setupSize bytes)"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-WindowsRuntime
          path: |
            ${{ env.WINDOWS_RUNTIME_SETUP }}
            ${{ env.WINDOWS_RUNTIME_ZIP }}
          if-no-files-found: error

      - name: Publish latest release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:WINDOWS_RUNTIME_RELEASE_TAG
          $setupPath = $env:WINDOWS_RUNTIME_SETUP
          $zipPath = $env:WINDOWS_RUNTIME_ZIP

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title "CpIPOS Windows Runtime Latest" `
              --notes "Latest CpIPOS Windows Runtime installer and portable ZIP built manually from GitHub Actions."
          }

          gh release upload $tag $setupPath $zipPath --clobber
          Write-Host "Installer URL: https://github.com/${{ github.repository }}/releases/download/$tag/$env:WINDOWS_RUNTIME_SETUP_ASSET_NAME"
          Write-Host "Portable ZIP URL: https://github.com/${{ github.repository }}/releases/download/$tag/$env:WINDOWS_RUNTIME_ZIP_ASSET_NAME"
