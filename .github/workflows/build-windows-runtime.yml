name: Build CpIPOS Windows Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - agent-docs-preflight-schema-drift
      - main
    paths:
      - "apps/windows-runtime-native/**"
      - ".github/workflows/build-windows-runtime.yml"

permissions:
  contents: write

env:
  WINDOWS_RUNTIME_PROJECT: apps/windows-runtime-native/Cpipos.WindowsRuntime/Cpipos.WindowsRuntime.csproj
  WINDOWS_RUNTIME_OUTPUT: artifacts/CpIPOS-WindowsRuntime-win-x64
  WINDOWS_RUNTIME_ZIP: artifacts/CpIPOS-WindowsRuntime-win-x64.zip
  WINDOWS_RUNTIME_RELEASE_TAG: windows-runtime-latest
  WINDOWS_RUNTIME_ASSET_NAME: CpIPOS-WindowsRuntime-win-x64.zip

jobs:
  build-windows-runtime:
    name: Build Windows Runtime ZIP
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:WINDOWS_RUNTIME_PROJECT

      - name: Publish Windows x64 self-contained app
        shell: pwsh
        run: |
          dotnet publish $env:WINDOWS_RUNTIME_PROJECT `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o $env:WINDOWS_RUNTIME_OUTPUT

      - name: Add README
        shell: pwsh
        run: |
          @'
          CpIPOS Windows Runtime
          ======================

          Run:
            Cpipos.WindowsRuntime.exe

          Optional command line:
            Cpipos.WindowsRuntime.exe --printer MTP-II
            Cpipos.WindowsRuntime.exe --windowed
            Cpipos.WindowsRuntime.exe --url=https://cp-ipos-web.vercel.app/login/store

          Local bridge inside the EXE:
            http://127.0.0.1:3210/health
            http://127.0.0.1:3210/printers
            http://127.0.0.1:3210/print/test
            http://127.0.0.1:3210/print

          Notes:
          - CpIPOS Web is still the main web app.
          - This ZIP is the Windows runtime package for Windows POS terminals.
          - It includes a native local print bridge.
          - Offline sales database and sync queue are not included yet.
          '@ | Set-Content -Encoding UTF8 "$env:WINDOWS_RUNTIME_OUTPUT/README-WINDOWS-RUNTIME.txt"

      - name: Zip package
        shell: pwsh
        run: |
          if (Test-Path $env:WINDOWS_RUNTIME_ZIP) {
            Remove-Item -Force $env:WINDOWS_RUNTIME_ZIP
          }
          Compress-Archive -Path "$env:WINDOWS_RUNTIME_OUTPUT/*" -DestinationPath $env:WINDOWS_RUNTIME_ZIP -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-WindowsRuntime-win-x64
          path: ${{ env.WINDOWS_RUNTIME_ZIP }}
          if-no-files-found: error

      - name: Publish latest release download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:WINDOWS_RUNTIME_RELEASE_TAG
          $assetPath = $env:WINDOWS_RUNTIME_ZIP
          $assetName = $env:WINDOWS_RUNTIME_ASSET_NAME

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title "CpIPOS Windows Runtime Latest" `
              --notes "Latest CpIPOS Windows Runtime ZIP built automatically from GitHub Actions."
          }

          gh release upload $tag $assetPath --clobber
          Write-Host "Download URL: https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"
