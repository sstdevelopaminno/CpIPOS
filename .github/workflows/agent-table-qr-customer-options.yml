name: Agent Table QR Customer Options Patch

on:
  push:
    branches:
      - agent/table-qr-customer-options-dinein-return

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/table-qr-customer-options-dinein-return
          fetch-depth: 0

      - name: Apply narrow patch
        run: python .github/run-agent-table-qr-patch.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          grep -n "customer_ingredient_selection_enabled" apps/backoffice-web/src/app/api/backoffice/catalog/route.ts apps/backoffice-web/src/lib/table-qr-ordering.ts apps/backoffice-web/src/components/pos-preview/edit-product-popup-button.tsx
          grep -n "Boolean(receiptSession?.table_id)" apps/backoffice-web/src/components/pos/pos-sales-module.tsx

      - name: Commit patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent-table-qr-customer-options.yml .github/agent-table-qr-patch.py .github/run-agent-table-qr-patch.py
          git add -A
          git commit -m "fix(pos): stabilize dine-in return and Table QR choices"
          git push origin HEAD:agent/table-qr-customer-options-dinein-return
