              '''.tableBadge::before {\n  content: "โต๊ะ ";\n  margin-right: 4px;\n  color: #4f89bf;\n  font-size: 13px;\n  font-weight: 800;\n}\n\n.submittedHistoryButton {\n  position: absolute;\n  right: 96px;\n  bottom: 18px;\n  display: inline-flex;\n  min-width: 44px;\n  min-height: 38px;\n  align-items: center;\n  justify-content: center;\n  gap: 5px;\n  padding: 0 9px;\n  border: 1px solid #b8d8f6;\n  border-radius: 999px;\n  background: #f6fbff;\n  color: #0871d7;\n  font-weight: 900;\n  box-shadow: 0 4px 12px rgba(8, 113, 215, 0.08);\n  cursor: pointer;\n  touch-action: manipulation;\n}\n.submittedHistoryButton span { min-width: 16px; font-size: 12px; text-align: center; }\n.submittedHistoryButton:active { transform: translateY(1px); }\n\n.cartSheet'''
