name: Finalize Android POS 1.0.0 docs

on:
  push:
    branches:
      - agent/product-media-final-ui-android-v1
    paths:
      - ".github/workflows/finalize-android-pos-v1-docs.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-media-final-ui-android-v1
          fetch-depth: 0

      - name: Append checkpoint and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = "## Android POS 1.0.0 / Product Media final UI checkpoint — 2026-08-11"
          note = (
              marker + "\n\n"
              "- Product Media promotes the summary toggle into the header on POS/desktop screens, removes the nested inner frame, and reduces the bounded list height so Previous / Page / Next is surfaced earlier on 1365x768 terminals.\n"
              "- Android Tablet POS is version 1.0.0 (versionCode 6) with Android System Document Picker support for Photos / Files / Google Drive, scoped storage, Bluetooth/Nearby/network/USB printer readiness, Device Admin / Device Owner enrollment foundation, and Web App launcher icon parity.\n"
              "- Broad All-files access and destructive unaudited MDM commands remain intentionally disabled. Full Device Owner provisioning, staged signed updates, rollback, and destructive policy authorization belong to the next IT Admin control-plane phase.\n"
              "- Detailed checkpoint: `docs/ANDROID-POS-1.0.0-RELEASE-2026-08-11.md`.\n"
          )

          for name in ("README.md", "context.md"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + "\n\n" + note, encoding="utf-8")

          Path(".github/workflows/finalize-android-pos-v1-docs.yml").unlink()
          PY

          git diff --check
          git config user.name "SST-CRUD"
          git config user.email "sstdevelopaminno@gmail.com"
          git add -A
          git commit -m "docs(android-pos): record Product Media final UI and 1.0.0 checkpoint"
          git push origin HEAD:agent/product-media-final-ui-android-v1
