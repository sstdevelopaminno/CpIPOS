name: FG0003 post-close v2 guarded patch

on:
  push:
    branches:
      - hotfix/fg0003-postclose-sync-20260822-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run fg0003 post-close v2 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/fg0003-postclose-sync-20260822-v2
          fetch-depth: 0

      - name: Apply narrow guarded incident patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hotfix/fg0003-table-bill-sync-20260822
          mkdir -p apps/backoffice-web/src/app/api/pos/sales/clear-dine-in
          git show origin/hotfix/fg0003-table-bill-sync-20260822:apps/backoffice-web/src/app/api/pos/sales/clear-dine-in/route.ts > apps/backoffice-web/src/app/api/pos/sales/clear-dine-in/route.ts
          git show origin/hotfix/fg0003-table-bill-sync-20260822:supabase/migrations/20260822023000_allow_empty_queued_dine_in_replacement.sql > supabase/migrations/20260822023000_allow_empty_queued_dine_in_replacement.sql

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          pos = Path('apps/backoffice-web/src/components/pos/pos-sales-module.tsx')
          replace_once(
              pos,
              '    if (orderType !== "dine_in" || !selectedTable?.id || !selectedTable.active_session_id || !shift || shift.status !== "open" || cart.length === 0 || !isOnline) return null;\n    const cartSnapshot = cloneCartItems(cart);\n    const signature = buildCartSignature(cartSnapshot);\n    const committedSignature = buildCartSignature(committedDineInCartByTableIdRef.current[selectedTable.id] ?? []);\n    if (signature === committedSignature) return null;',
              '''    if (orderType !== "dine_in" || !selectedTable?.id || !selectedTable.active_session_id || !shift || shift.status !== "open" || !isOnline) return null;\n    const cartSnapshot = cloneCartItems(cart);\n    const signature = buildCartSignature(cartSnapshot);\n    const committedCart = committedDineInCartByTableIdRef.current[selectedTable.id] ?? [];\n    const committedSignature = buildCartSignature(committedCart);\n    if (signature === committedSignature) return null;\n    const canClearExistingDineIn =\n      cartSnapshot.length === 0 &&\n      activeOrder?.status === "queued" &&\n      (!activeOrder.table_id || activeOrder.table_id === selectedTable.id) &&\n      (committedCart.length > 0 || lastCommittedCartSignature !== null);\n    if (cartSnapshot.length === 0 && !canClearExistingDineIn) return null;'''
          )
          replace_once(
              pos,
              '    const job = dineInAutoSendJobsRef.current.get(tableId);\n    if (!job || job.cart.length === 0) return;\n    const committedSignature = buildCartSignature(committedDineInCartByTableIdRef.current[tableId] ?? []);',
              '''    const job = dineInAutoSendJobsRef.current.get(tableId);\n    if (!job) return;\n    const committedCart = committedDineInCartByTableIdRef.current[tableId] ?? [];\n    const committedSignature = buildCartSignature(committedCart);\n    const canClearExistingDineIn =\n      job.cart.length === 0 &&\n      job.activeOrder?.status === "queued" &&\n      (committedCart.length > 0 || (selectedTableRef.current?.id === tableId && lastCommittedCartSignature !== null));\n    if (job.cart.length === 0 && !canClearExistingDineIn) {\n      dineInAutoSendJobsRef.current.delete(tableId);\n      return;\n    }'''
          )
          replace_once(
              pos,
              '    try {\n      const latestTaxSettings = await refreshTaxSettings();',
              '''    try {\n      if (job.cart.length === 0 && job.activeOrder?.status === "queued") {\n        const clearResponse = await fetch("/api/pos/sales/clear-dine-in", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ order_id: job.activeOrder.id, table_id: tableId })\n        });\n        const clearBody = (await clearResponse.json().catch(() => null)) as\n          | { data?: { total_amount?: number }; error?: { message?: string } }\n          | null;\n        if (!clearResponse.ok) {\n          throw new Error(clearBody?.error?.message || "Unable to clear dine-in bill items.");\n        }\n        const clearedOrder: ActiveOrder = {\n          ...job.activeOrder,\n          total_amount: Number(clearBody?.data?.total_amount ?? 0)\n        };\n        committedDineInCartByTableIdRef.current = {\n          ...committedDineInCartByTableIdRef.current,\n          [tableId]: []\n        };\n        rememberDineInDraft(tableId, []);\n        if (selectedTableRef.current?.id === tableId) {\n          setActiveOrder(clearedOrder);\n          setLastCommittedCartSignature(job.signature);\n        }\n        void fetchPosTables().catch(() => undefined);\n        return;\n      }\n\n      const latestTaxSettings = await refreshTaxSettings();'''
          )

          test = Path('apps/backoffice-web/tests/integration/fg0003-final-item-clear-regression.integration.test.ts')
          test.write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n\nfunction source(relativePath: string) {\n  return readFileSync(new URL(relativePath, import.meta.url), "utf8");\n}\n\nconst migration = source("../../../../supabase/migrations/20260822023000_allow_empty_queued_dine_in_replacement.sql");\nconst clearRoute = source("../../src/app/api/pos/sales/clear-dine-in/route.ts");\nconst salesUi = source("../../src/components/pos/pos-sales-module.tsx");\n\ndescribe("FG0003 final dine-in line clearing", () => {\n  it("allows only explicit empty desired state while retaining non-empty validation", () => {\n    expect(migration).toContain("jsonb_array_length(p_items) > 0 and v_item_count < 1");\n    expect(migration).toContain("TABLE_BILL_ORDER_CONFLICT");\n    expect(migration).toContain("v_order.status <> 'queued'");\n    expect(migration).toContain("v_order.order_type <> 'dine_in'");\n    expect(migration).toContain("'kitchen_delta_kind', 'cancel'");\n  });\n\n  it("clears only the exact queued order bound to the exact live table session", () => {\n    expect(clearRoute).toContain('.eq("table_id", tableId)');\n    expect(clearRoute).toContain("session.order_id !== orderId");\n    expect(clearRoute).toContain('order.status !== "queued"');\n    expect(clearRoute).toContain("p_items: []");\n    expect(clearRoute).toContain("queueMissingKitchenPrintJobsForOrder");\n  });\n\n  it("does not drop an empty cashier desired state after kitchen dispatch", () => {\n    expect(salesUi).toContain('fetch("/api/pos/sales/clear-dine-in"');\n    expect(salesUi).toContain("cartSnapshot.length === 0 &&");\n    expect(salesUi).toContain("job.cart.length === 0 && job.activeOrder?.status === \"queued\"");\n    expect(salesUi).not.toContain('shift.status !== "open" || cart.length === 0 || !isOnline) return null;');\n    expect(salesUi).not.toContain('if (!job || job.cart.length === 0) return;');\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Commit guarded patch and remove runner
        shell: bash
        run: |
          git rm .github/workflows/fg0003-postclose-v2-one-shot.yml
          git config user.name "CpIPOS Hotfix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/backoffice-web/src/app/api/pos/sales/clear-dine-in/route.ts \
                  apps/backoffice-web/src/components/pos/pos-sales-module.tsx \
                  apps/backoffice-web/tests/integration/fg0003-final-item-clear-regression.integration.test.ts \
                  supabase/migrations/20260822023000_allow_empty_queued_dine_in_replacement.sql
          git commit -m "fix(pos): clear final queued dine-in item safely"
          git push origin HEAD:hotfix/fg0003-postclose-sync-20260822-v2
