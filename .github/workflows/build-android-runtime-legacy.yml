name: Build CpIPOS Android POS Legacy Android 7.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - ".github/workflows/build-android-runtime-legacy.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_BASE_VERSION: 1.0.10
  ANDROID_RUNTIME_LEGACY_VERSION: 1.0.10-legacy7.1-r3
  ANDROID_RUNTIME_LEGACY_MIN_SDK: 25
  ANDROID_RUNTIME_LEGACY_TARGET_SDK: 25
  ANDROID_RUNTIME_LEGACY_RELEASE_TAG: android-runtime-legacy-7-1
  ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME: CpIPOS-Android-POS-Legacy-Android-7.1.apk
  ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME: CpIPOS-Android-POS-1.0.10-Legacy-Android-7.1-r3.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-android-runtime-legacy:
    name: Build isolated Android 7.1 Legacy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Guard current stable Android source
        run: |
          buildFile="${{ env.ANDROID_RUNTIME_MODULE }}/app/build.gradle.kts"
          grep -qF 'minSdk = 26' "$buildFile" || { echo "Current Android minSdk changed; refusing legacy build."; exit 1; }
          grep -qF 'targetSdk = 34' "$buildFile" || { echo "Current Android targetSdk changed; refusing legacy build."; exit 1; }
          grep -qF 'versionName = "${{ env.ANDROID_RUNTIME_BASE_VERSION }}"' "$buildFile" || { echo "Current Android version changed; refusing legacy build."; exit 1; }
          echo "Production Android remains ${{ env.ANDROID_RUNTIME_BASE_VERSION }} with minSdk 26 / targetSdk 34."

      - name: Create isolated Android 7.1 compatibility workspace
        run: |
          legacyDir="$RUNNER_TEMP/cpipos-pos-android-legacy"
          cp -a "${{ env.ANDROID_RUNTIME_MODULE }}" "$legacyDir"

          buildFile="$legacyDir/app/build.gradle.kts"
          manifestFile="$legacyDir/app/src/main/AndroidManifest.xml"

          # Compatibility mutations happen only in RUNNER_TEMP. Production source is never edited.
          sed -i 's/minSdk = 26/minSdk = 25/' "$buildFile"
          sed -i 's/targetSdk = 34/targetSdk = 25/' "$buildFile"
          sed -i 's/versionName = "1.0.10"/versionName = "1.0.10-legacy7.1-r3"/' "$buildFile"

          # Remove permissions introduced after Android 7.1 from this temporary legacy manifest only.
          sed -i '/android.permission.BLUETOOTH_SCAN/d' "$manifestFile"
          sed -i '/android.permission.BLUETOOTH_CONNECT/d' "$manifestFile"
          sed -i '/android.permission.NEARBY_WIFI_DEVICES/d' "$manifestFile"
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' "$manifestFile"

          # This is a direct-sideload compatibility artifact, not a Google Play artifact.
          # Disable only the target-age Play lint in the temporary API 25 copy.
          cat >> "$buildFile" <<'EOF'

          android {
              lint {
                  disable += "ExpiredTargetSdkVersion"
              }
          }
          EOF

          grep -qF 'minSdk = 25' "$buildFile"
          grep -qF 'targetSdk = 25' "$buildFile"
          grep -qF 'versionName = "1.0.10-legacy7.1-r3"' "$buildFile"
          grep -qF 'disable += "ExpiredTargetSdkVersion"' "$buildFile"

          if grep -Eq 'BLUETOOTH_SCAN|BLUETOOTH_CONNECT|NEARBY_WIFI_DEVICES|REQUEST_INSTALL_PACKAGES' "$manifestFile"; then
            echo "A post-Android-7.1 permission remained in the temporary legacy manifest."
            exit 1
          fi

          echo "LEGACY_RUNTIME_MODULE=$legacyDir" >> "$GITHUB_ENV"
          echo "Legacy workspace prepared outside the checked-out production source tree."

      - name: Run Android print unit tests on legacy workspace
        run: |
          cd "$LEGACY_RUNTIME_MODULE"
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable Android signing secrets are not configured."
          fi

      - name: Require stable signing for legacy customer APK
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Legacy customer APK requires the existing stable ANDROID_SIGNING_* secrets."
          exit 1

      - name: Materialize and validate stable signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"

          certSha=$(keytool -list -v \
            -keystore "$keystorePath" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')

          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Signing certificate mismatch. Expected ${{ env.ANDROID_SIGNING_CERT_SHA256 }}, got $certSha"
            exit 1
          fi
          echo "Stable signing certificate verified: $certSha"

      - name: Build unsigned Android 7.1 legacy APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          # Do not expose signing variables to Gradle. We explicitly sign after alignment with apksigner.
          unset CPIPOS_ANDROID_KEYSTORE_PATH CPIPOS_ANDROID_STORE_PASSWORD CPIPOS_ANDROID_KEY_ALIAS CPIPOS_ANDROID_KEY_PASSWORD || true
          cd "$LEGACY_RUNTIME_MODULE"
          gradle :app:assembleRelease --no-daemon --stacktrace

          releaseDir="$LEGACY_RUNTIME_MODULE/app/build/outputs/apk/release"
          unsignedApk=$(find "$releaseDir" -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$unsignedApk" ] || [ ! -f "$unsignedApk" ]; then
            echo "Unsigned legacy APK was not produced."
            exit 1
          fi
          echo "LEGACY_UNSIGNED_APK=$unsignedApk" >> "$GITHUB_ENV"
          echo "Unsigned legacy APK ready: $unsignedApk"

      - name: Explicitly align, v1+v2 sign, verify and stage legacy APK
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          zipalignPath=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          if [ -z "$aaptPath" ] || [ -z "$apksignerPath" ] || [ -z "$zipalignPath" ]; then
            echo "Android build-tools verification/signing utilities were not found."
            exit 1
          fi

          keystorePath="$RUNNER_TEMP/cpipos-android-signing/cpipos-android-release.jks"
          alignedApk="$RUNNER_TEMP/cpipos-legacy-api25-aligned.apk"
          signedApk="$RUNNER_TEMP/cpipos-legacy-api25-v1v2-signed.apk"

          # A v2 signature must be applied after zip alignment.
          "$zipalignPath" -p -f 4 "$LEGACY_UNSIGNED_APK" "$alignedApk"
          "$zipalignPath" -c -v 4 "$alignedApk"

          # Force exactly the signing schemes needed by Android 7.1/OEM package installers.
          "$apksignerPath" sign \
            --ks "$keystorePath" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --min-sdk-version "${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$signedApk" \
            "$alignedApk"

          "$zipalignPath" -c -v 4 "$signedApk"

          apkSize=$(stat -c%s "$signedApk")
          if [ "$apkSize" -lt 1000000 ]; then
            echo "Legacy APK size looks too small: $apkSize bytes"
            exit 1
          fi

          badging=$("$aaptPath" dump badging "$signedApk")
          echo "$badging" | grep -q "sdkVersion:'${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }}'" || {
            echo "Legacy APK does not declare minSdk ${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }}."
            echo "$badging" | head -n 20
            exit 1
          }
          echo "$badging" | grep -q "targetSdkVersion:'${{ env.ANDROID_RUNTIME_LEGACY_TARGET_SDK }}'" || {
            echo "Legacy APK does not declare targetSdk ${{ env.ANDROID_RUNTIME_LEGACY_TARGET_SDK }}."
            echo "$badging" | head -n 20
            exit 1
          }

          permissions=$("$aaptPath" dump permissions "$signedApk")
          if echo "$permissions" | grep -Eq 'BLUETOOTH_SCAN|BLUETOOTH_CONNECT|NEARBY_WIFI_DEVICES|REQUEST_INSTALL_PACKAGES'; then
            echo "Legacy APK still contains a post-Android-7.1 permission."
            echo "$permissions"
            exit 1
          fi

          signatureReport=$("$apksignerPath" verify \
            --verbose \
            --print-certs \
            --min-sdk-version "${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }}" \
            "$signedApk")
          echo "$signatureReport"
          echo "$signatureReport" | grep -q 'Verified using v1 scheme (JAR signing): true' || {
            echo "Legacy APK is missing v1 signature compatibility."
            exit 1
          }
          echo "$signatureReport" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' || {
            echo "Legacy APK is missing v2 signature compatibility."
            exit 1
          }
          echo "$signatureReport" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): false' || {
            echo "Legacy APK unexpectedly contains v3 signing."
            exit 1
          }

          certSha=$("$apksignerPath" verify --print-certs "$signedApk" \
            | sed -n 's/^.*certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Legacy APK certificate mismatch. Expected ${{ env.ANDROID_SIGNING_CERT_SHA256 }}, got $certSha"
            exit 1
          fi

          apkSha=$(sha256sum "$signedApk" | awk '{print $1}')
          mkdir -p artifacts
          cp "$signedApk" "artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
          cp "$signedApk" "artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}"
          echo "Legacy Android 7.1 r3 ready: size=$apkSize sha256=$apkSha minSdk=${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }} targetSdk=${{ env.ANDROID_RUNTIME_LEGACY_TARGET_SDK }} certificate=$certSha v1=true v2=true"

      - name: Upload legacy workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.10-Legacy-Android-7.1-r3-v1v2-signed
          path: |
            artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish isolated Android 7.1 legacy release
        if: steps.signing.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/agent-docs-preflight-schema-drift'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_LEGACY_RELEASE_TAG }}"
          stablePath="artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
          versionedPath="artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "CpIPOS Android POS Legacy - Android 7.1" \
              --notes "Isolated Android 7.1/API 25 compatibility release based on CpIPOS 1.0.10. Separate from android-runtime-latest and never overwrites CpIPOS-Android-POS.apk."
          fi

          gh release upload "$tag" "$stablePath" "$versionedPath" --clobber
          echo "Legacy APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
