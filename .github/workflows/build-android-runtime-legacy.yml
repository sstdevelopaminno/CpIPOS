name: Build CpIPOS Android POS Legacy Android 7.1

on:
  workflow_dispatch:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - ".github/workflows/build-android-runtime-legacy.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_BASE_VERSION: 1.0.10
  ANDROID_RUNTIME_LEGACY_VERSION: 1.0.10-legacy7.1-r2
  ANDROID_RUNTIME_LEGACY_MIN_SDK: 25
  ANDROID_RUNTIME_LEGACY_TARGET_SDK: 25
  ANDROID_RUNTIME_LEGACY_RELEASE_TAG: android-runtime-legacy-7-1
  ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME: CpIPOS-Android-POS-Legacy-Android-7.1.apk
  ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME: CpIPOS-Android-POS-1.0.10-Legacy-Android-7.1-r2.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-android-runtime-legacy:
    name: Build isolated Android 7.1 Legacy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Guard current stable Android source
        run: |
          buildFile="${{ env.ANDROID_RUNTIME_MODULE }}/app/build.gradle.kts"
          grep -qF 'minSdk = 26' "$buildFile" || { echo "Current Android minSdk changed; refusing legacy build."; exit 1; }
          grep -qF 'targetSdk = 34' "$buildFile" || { echo "Current Android targetSdk changed; refusing legacy build."; exit 1; }
          grep -qF 'versionName = "${{ env.ANDROID_RUNTIME_BASE_VERSION }}"' "$buildFile" || { echo "Current Android version changed; refusing legacy build."; exit 1; }
          echo "Production Android remains ${{ env.ANDROID_RUNTIME_BASE_VERSION }} / minSdk 26 / targetSdk 34."

      - name: Create isolated Android 7.1 compatibility workspace
        run: |
          legacyDir="$RUNNER_TEMP/cpipos-pos-android-legacy"
          cp -a "${{ env.ANDROID_RUNTIME_MODULE }}" "$legacyDir"
          buildFile="$legacyDir/app/build.gradle.kts"
          manifestFile="$legacyDir/app/src/main/AndroidManifest.xml"

          # Compatibility mutations are confined to RUNNER_TEMP only.
          sed -i 's/minSdk = 26/minSdk = 25/' "$buildFile"
          sed -i 's/targetSdk = 34/targetSdk = 25/' "$buildFile"
          sed -i 's/versionName = "1.0.10"/versionName = "1.0.10-legacy7.1-r2"/' "$buildFile"
          sed -i 's/enableV3Signing = true/enableV3Signing = false/' "$buildFile"
          sed -i 's/enableV4Signing = true/enableV4Signing = false/' "$buildFile"

          # Remove permissions introduced after Android 7.1 from this isolated legacy manifest.
          sed -i '/android.permission.BLUETOOTH_SCAN/d' "$manifestFile"
          sed -i '/android.permission.BLUETOOTH_CONNECT/d' "$manifestFile"
          sed -i '/android.permission.NEARBY_WIFI_DEVICES/d' "$manifestFile"
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' "$manifestFile"

          # Direct sideload compatibility artifact; Google Play target-age lint is not applicable.
          cat >> "$buildFile" <<'EOF'

          android {
              lint {
                  disable += "ExpiredTargetSdkVersion"
              }
          }
          EOF

          grep -qF 'minSdk = 25' "$buildFile"
          grep -qF 'targetSdk = 25' "$buildFile"
          grep -qF 'versionName = "1.0.10-legacy7.1-r2"' "$buildFile"
          grep -qF 'enableV3Signing = false' "$buildFile"
          grep -qF 'enableV4Signing = false' "$buildFile"
          grep -qF 'disable += "ExpiredTargetSdkVersion"' "$buildFile"

          if grep -Eq 'BLUETOOTH_SCAN|BLUETOOTH_CONNECT|NEARBY_WIFI_DEVICES|REQUEST_INSTALL_PACKAGES' "$manifestFile"; then
            echo "Post-Android-7.1 permission remained in isolated legacy manifest."
            exit 1
          fi

          echo "LEGACY_RUNTIME_MODULE=$legacyDir" >> "$GITHUB_ENV"

      - name: Run Android print unit tests on legacy workspace
        run: |
          cd "$LEGACY_RUNTIME_MODULE"
          gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require stable signing for legacy customer APK
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Legacy customer APK requires existing stable ANDROID_SIGNING_* secrets."
          exit 1

      - name: Materialize and validate stable signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"

          certSha=$(keytool -list -v -keystore "$keystorePath" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Signing certificate mismatch."
            exit 1
          fi

      - name: Build signed Android 7.1 legacy APK
        if: steps.signing.outputs.ready == 'true'
        env:
          CPIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-android-signing/cpipos-android-release.jks
          CPIPOS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CPIPOS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CPIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          cd "$LEGACY_RUNTIME_MODULE"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and stage isolated legacy APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          apkPath="$LEGACY_RUNTIME_MODULE/app/build/outputs/apk/release/app-release.apk"
          [ -f "$apkPath" ] || { echo "Built legacy APK missing."; exit 1; }

          apkSize=$(stat -c%s "$apkPath")
          [ "$apkSize" -ge 1000000 ] || { echo "Legacy APK size too small: $apkSize"; exit 1; }

          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          [ -n "$aaptPath" ] && [ -n "$apksignerPath" ] || { echo "Android verification utilities missing."; exit 1; }

          badging=$("$aaptPath" dump badging "$apkPath")
          echo "$badging" | grep -q "sdkVersion:'${{ env.ANDROID_RUNTIME_LEGACY_MIN_SDK }}'" || { echo "Legacy minSdk mismatch."; exit 1; }
          echo "$badging" | grep -q "targetSdkVersion:'${{ env.ANDROID_RUNTIME_LEGACY_TARGET_SDK }}'" || { echo "Legacy targetSdk mismatch."; exit 1; }

          permissions=$("$aaptPath" dump permissions "$apkPath")
          if echo "$permissions" | grep -Eq 'BLUETOOTH_SCAN|BLUETOOTH_CONNECT|NEARBY_WIFI_DEVICES|REQUEST_INSTALL_PACKAGES'; then
            echo "Legacy APK contains a post-Android-7.1 permission."
            exit 1
          fi

          # Android 7.0+ supports APK Signature Scheme v2. This artifact's minSdk is API 25,
          # therefore a verified v2 signature is sufficient for every supported device.
          signatureReport=$("$apksignerPath" verify --verbose --print-certs "$apkPath")
          echo "$signatureReport"
          echo "$signatureReport" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' || { echo "Legacy APK missing Android 7 compatible v2 signature."; exit 1; }
          echo "$signatureReport" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): false' || { echo "Unexpected v3 signature."; exit 1; }
          echo "$signatureReport" | grep -q 'Verified using v4 scheme (APK Signature Scheme v4): false' || { echo "Unexpected v4 signature."; exit 1; }

          certSha=$("$apksignerPath" verify --print-certs "$apkPath" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [ "$certSha" = "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ] || { echo "Legacy certificate mismatch."; exit 1; }

          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}"
          echo "Legacy Android 7.1 r2 ready: $apkSize bytes; minSdk=25; targetSdk=25; v2=true; cert=$certSha"

      - name: Upload legacy workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.10-Legacy-Android-7.1-r2-stable-signed
          path: |
            artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}
            artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish isolated Android 7.1 legacy release
        if: steps.signing.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/agent-docs-preflight-schema-drift'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_LEGACY_RELEASE_TAG }}"
          stablePath="artifacts/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
          versionedPath="artifacts/${{ env.ANDROID_RUNTIME_LEGACY_VERSIONED_ASSET_NAME }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "${{ github.sha }}" --title "CpIPOS Android POS Legacy - Android 7.1" --notes "Isolated Android 7.1/API25 compatibility build based on CpIPOS Android POS 1.0.10. Separate from android-runtime-latest."
          fi

          gh release upload "$tag" "$stablePath" "$versionedPath" --clobber
          echo "Legacy APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_LEGACY_APK_ASSET_NAME }}"
