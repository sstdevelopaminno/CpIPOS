name: Build CpIPOS Mobile Android

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/cpipos-mobile-android/**"
      - "apps/backoffice-web/src/app/download/mobile/**"
      - ".github/workflows/build-cpipos-mobile-android.yml"
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/cpipos-mobile-android/**"
      - "apps/backoffice-web/src/app/download/mobile/**"
      - ".github/workflows/build-cpipos-mobile-android.yml"

permissions:
  contents: write

env:
  MOBILE_ANDROID_MODULE: apps/cpipos-mobile-android
  MOBILE_ANDROID_VERSION: 1.0.0
  MOBILE_ANDROID_RELEASE_TAG: cpipos-mobile-latest
  MOBILE_ANDROID_APK_ASSET_NAME: CpIPOS-Mobile.apk

jobs:
  build-cpipos-mobile:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate native-only architecture and version
        run: |
          buildFile="${{ env.MOBILE_ANDROID_MODULE }}/app/build.gradle.kts"
          expected='versionName = "${{ env.MOBILE_ANDROID_VERSION }}"'
          if ! grep -qF -- "$expected" "$buildFile"; then
            echo "$buildFile versionName does not match ${{ env.MOBILE_ANDROID_VERSION }}"
            exit 1
          fi

          if grep -R --line-number --include='*.kt' --include='*.kts' \
            -E 'android\.webkit\.WebView|WebViewClient|loadUrl\(' \
            "${{ env.MOBILE_ANDROID_MODULE }}/app/src" >/tmp/cpipos-mobile-webview-hits.txt; then
            cat /tmp/cpipos-mobile-webview-hits.txt
            echo "CpIPOS Mobile must remain a native Android app. WebView usage is forbidden."
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ env.MOBILE_ANDROID_MODULE }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate and validate APK
        run: |
          apkPath="${{ env.MOBILE_ANDROID_MODULE }}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$apkPath" ]; then
            echo "Built APK not found at $apkPath"
            exit 1
          fi
          apkSize=$(stat -c%s "$apkPath")
          if [ "$apkSize" -lt 1000000 ]; then
            echo "APK size looks too small: $apkSize bytes"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.MOBILE_ANDROID_APK_ASSET_NAME }}"
          echo "APK ready: artifacts/${{ env.MOBILE_ANDROID_APK_ASSET_NAME }} ($apkSize bytes)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Mobile-Android
          path: artifacts/${{ env.MOBILE_ANDROID_APK_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish latest release download
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent-docs-preflight-schema-drift'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.MOBILE_ANDROID_RELEASE_TAG }}"
          apkPath="artifacts/${{ env.MOBILE_ANDROID_APK_ASSET_NAME }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "CpIPOS Mobile Android Latest" \
              --notes "Latest native Android build of CpIPOS Mobile. Kotlin + Jetpack Compose; no WebView or separate mobile web hosting."
          fi

          gh release upload "$tag" "$apkPath" --clobber
          echo "APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.MOBILE_ANDROID_APK_ASSET_NAME }}"
