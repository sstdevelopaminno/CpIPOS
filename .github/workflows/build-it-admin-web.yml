name: Build IT Admin Web

on:
  push:
    branches:
      - feat/it-ops-control-center
    paths:
      - 'apps/it-admin-web/**'
      - '.github/workflows/build-it-admin-web.yml'
  workflow_dispatch:

jobs:
  build-it-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/it-admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck IT Admin only
        run: npm run typecheck
      - name: Build IT Admin only
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
