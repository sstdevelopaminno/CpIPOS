name: Patch Android runtime version once
on:
  push:
    branches: [fix/print-latency-receipt-spacing-stability-20260817]
    paths: [.github/workflows/patch-android-runtime-version-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/print-latency-receipt-spacing-stability-20260817
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-android-runtime.yml')
          s=p.read_text()
          pairs=[
            ('ANDROID_RUNTIME_VERSION: 1.0.10','ANDROID_RUNTIME_VERSION: 1.0.11'),
            ('ANDROID_RUNTIME_VERSIONED_ASSET_NAME: CpIPOS-Android-POS-1.0.10.apk','ANDROID_RUNTIME_VERSIONED_ASSET_NAME: CpIPOS-Android-POS-1.0.11.apk'),
            ('Native LAN/USB/Bluetooth ESC/POS print agent, adaptive idle claim polling, WebView POS runtime, MDM diagnostics, and managed-device readiness.','Native LAN/USB/Bluetooth ESC/POS print agent, adaptive idle claim polling with event-driven print wake, WebView POS runtime, MDM diagnostics, and managed-device readiness.')
          ]
          for old,new in pairs:
            if s.count(old)!=1: raise SystemExit(f'anchor count {s.count(old)} for {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-android-runtime-version-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(android): align 1.0.11 release workflow"
          git push origin HEAD:fix/print-latency-receipt-spacing-stability-20260817
