name: Build CpIPOS Android POS Dual Screen 1.0.13

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-runtime-dual-screen.yml"
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - "apps/pos-android/**"
      - ".github/workflows/build-android-runtime-dual-screen.yml"

permissions:
  contents: write

env:
  ANDROID_RUNTIME_MODULE: apps/pos-android
  ANDROID_RUNTIME_VERSION: 1.0.13
  ANDROID_RUNTIME_VERSION_CODE: "19"
  ANDROID_RUNTIME_RELEASE_TAG: android-runtime-dual-screen-1-0-13
  ANDROID_RUNTIME_APK_ASSET_NAME: CpIPOS-Android-POS-1.0.13-Dual-Screen.apk
  ANDROID_SIGNING_CERT_SHA256: 6be0a9aef346a5b47162c8928c5018a01d0e7d81b4eb177bf2fb89922dc2a27a

jobs:
  build-dual-screen:
    name: Build Android Dual Screen 1.0.13 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run Android unit tests with dual-screen build config
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:testDebugUnitTest --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Detect stable signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and validate signing keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signingDir="$RUNNER_TEMP/cpipos-android-signing"
          keystorePath="$signingDir/cpipos-android-release.jks"
          mkdir -p "$signingDir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystorePath"
          chmod 600 "$keystorePath"
          certSha=$(keytool -list -v -keystore "$keystorePath" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "Signing certificate mismatch: $certSha"
            exit 1
          fi

      - name: Build signed dual-screen release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        env:
          CPIPOS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cpipos-android-signing/cpipos-android-release.jks
          CPIPOS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          CPIPOS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          CPIPOS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          gradle :app:assembleRelease --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Build dual-screen debug smoke APK when signing is unavailable
        if: steps.signing.outputs.ready != 'true'
        working-directory: ${{ env.ANDROID_RUNTIME_MODULE }}
        run: >-
          gradle :app:assembleDebug --no-daemon --stacktrace
          -PcpiposVersionName=${{ env.ANDROID_RUNTIME_VERSION }}
          -PcpiposVersionCode=${{ env.ANDROID_RUNTIME_VERSION_CODE }}
          -PcpiposDualScreen=true

      - name: Require signing secrets for manual release
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready != 'true'
        run: |
          echo "Manual 1.0.13 release requires ANDROID_SIGNING_* repository secrets."
          exit 1

      - name: Verify and stage signed 1.0.13 APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          apkPath="${{ env.ANDROID_RUNTIME_MODULE }}/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apkPath" ]; then
            echo "Release APK not found: $apkPath"
            exit 1
          fi
          aaptPath=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          apksignerPath=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$aaptPath" ] || [ -z "$apksignerPath" ]; then
            echo "Android build tools not found"
            exit 1
          fi
          badging=$("$aaptPath" dump badging "$apkPath" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "versionCode='${{ env.ANDROID_RUNTIME_VERSION_CODE }}'"
          echo "$badging" | grep -q "versionName='${{ env.ANDROID_RUNTIME_VERSION }}'"
          "$apksignerPath" verify --verbose --print-certs "$apkPath"
          certSha=$("$apksignerPath" verify --print-certs "$apkPath" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$certSha" != "${{ env.ANDROID_SIGNING_CERT_SHA256 }}" ]; then
            echo "APK certificate mismatch: $certSha"
            exit 1
          fi
          mkdir -p artifacts
          cp "$apkPath" "artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"

      - name: Upload signed dual-screen artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CpIPOS-Android-POS-1.0.13-dual-screen-signed
          path: artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}
          if-no-files-found: error

      - name: Publish dual-screen 1.0.13 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent-docs-preflight-schema-drift' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ env.ANDROID_RUNTIME_RELEASE_TAG }}"
          apkPath="artifacts/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "${{ github.sha }}" \
              --title "CpIPOS Android POS 1.0.13 Dual Screen" \
              --notes "CpIPOS Android POS 1.0.13 signed release for dual-screen POS hardware. Keeps the main POS WebView and opens Customer Display V2 automatically on an Android secondary display while reporting display diagnostics through MDM."
          fi
          gh release upload "$tag" "$apkPath" --clobber
          echo "Dual-screen APK URL: https://github.com/${{ github.repository }}/releases/download/$tag/${{ env.ANDROID_RUNTIME_APK_ASSET_NAME }}"
