name: Product Media UI Docs Finalizer

on:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - .github/workflows/product-media-ui-docs-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README and context
        shell: bash
        run: |
          if ! grep -q "Product Media UI follow-up — 2026-08-11" README.md; then
            cat >> README.md <<'EOF'

## Product Media UI follow-up — 2026-08-11

- `/preview/pos/stock/media` now hides the three storage-summary cards by default and exposes a `Show Summary / Hide Summary` toggle without changing quota calculations.
- Product-image rows are bounded to a POS-friendly vertical scroll area and use 10 items per page with visible range text plus Previous / Page / Next controls.
- Search resets the media list to page 1; changing pages scrolls the list container back to the top.
- The old label-wrapped hidden file input was replaced by a real upload button backed by one shared file input using `showPicker()` with `.click()` fallback for better Web/POS wrapper compatibility.
- Upload/replace/delete APIs, Cloud quota rules, POS cache behavior, Web POS sales images and Table QR media behavior are unchanged.
- PR #50 passed Typecheck, Lint, Tests, Primary schema drift, Trial schema drift and PR production build before merge.
EOF
          fi

          if ! grep -q "Product Media UI follow-up — 2026-08-11" context.md; then
            cat >> context.md <<'EOF'

## Product Media UI follow-up — 2026-08-11

- Product Media management now defaults storage summary cards to hidden with an in-page Show/Hide Summary toggle.
- Product media rows use a bounded scroll region and 10-row client pagination with range text, Previous / Page / Next, search-to-page-1 reset and scroll-to-top on page changes.
- Product upload activation now uses a real button and a shared file input (`showPicker()` with `.click()` fallback) instead of a label around a hidden file input, improving compatibility with POS WebView/desktop wrappers while preserving the same upload API.
- No auth, tenant isolation, package quota calculation, stock/order/payment/shift transaction or Table QR ordering semantics changed.
- PR #50 CI passed Typecheck, Lint, Tests, both schema drift checks and PR build before Production merge.
EOF
          fi

          rm -f .github/workflows/product-media-ui-docs-finalizer.yml

          git config user.name "SST-CRUD"
          git config user.email "sstdevelopaminno@gmail.com"
          git add README.md context.md .github/workflows/product-media-ui-docs-finalizer.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs(product-media): record UI picker and pagination follow-up"
            git push origin HEAD:agent-docs-preflight-schema-drift
          fi