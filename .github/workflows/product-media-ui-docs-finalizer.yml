name: Product Media UI Docs Finalizer

on:
  push:
    branches:
      - agent-docs-preflight-schema-drift
    paths:
      - .github/workflows/product-media-ui-docs-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update README and context
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("README.md"); marker="Product Media UI follow-up — 2026-08-11"; note="\n\n## Product Media UI follow-up — 2026-08-11\n\n- `/preview/pos/stock/media` hides the three storage-summary cards by default and exposes a `Show Summary / Hide Summary` toggle without changing quota calculations.\n- Product-image rows use a POS-friendly bounded vertical scroll area and 10 items per page with visible range text plus Previous / Page / Next controls.\n- Search resets the media list to page 1; changing pages scrolls the list container back to the top.\n- Upload activation uses a real button backed by one shared file input with `showPicker()` and `.click()` fallback for better Web/POS wrapper compatibility.\n- Upload/replace/delete APIs, Cloud quota rules, POS cache behavior, Web POS sales images and Table QR media behavior remain unchanged.\n- PR #50 passed Typecheck, Lint, Tests, Primary schema drift, Trial schema drift and PR production build before merge.\n"; s=p.read_text(encoding="utf-8"); p.write_text(s if marker in s else s+note, encoding="utf-8")'
          python -c 'from pathlib import Path; p=Path("context.md"); marker="Product Media UI follow-up — 2026-08-11"; note="\n\n## Product Media UI follow-up — 2026-08-11\n\n- Product Media management defaults storage summary cards to hidden with an in-page Show/Hide Summary toggle.\n- Product media rows use a bounded scroll region and 10-row client pagination with range text, Previous / Page / Next, search-to-page-1 reset and scroll-to-top on page changes.\n- Product upload activation uses a real button and a shared file input (`showPicker()` with `.click()` fallback) instead of a label around a hidden file input, improving POS WebView/desktop wrapper compatibility while preserving the same upload API.\n- No auth, tenant isolation, package quota calculation, stock/order/payment/shift transaction or Table QR ordering semantics changed.\n- PR #50 CI passed Typecheck, Lint, Tests, both schema drift checks and PR build before Production merge.\n"; s=p.read_text(encoding="utf-8"); p.write_text(s if marker in s else s+note, encoding="utf-8")'
          rm -f .github/workflows/product-media-ui-docs-finalizer.yml
          git config user.name "SST-CRUD"
          git config user.email "sstdevelopaminno@gmail.com"
          git add README.md context.md .github/workflows/product-media-ui-docs-finalizer.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs(product-media): record UI picker and pagination follow-up"
            git push origin HEAD:agent-docs-preflight-schema-drift
          fi